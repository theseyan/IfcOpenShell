schema_version: 1
module: ifcopenshell
slice: ifcparse
c_prefix: ifcopenshell_ifcparse

public_headers:
  - ifc_parse_api.h
  - parse.h
  - exception.h
  - logger.h
  - si_prefix.h
  - utils.h
  - schemas/Header_section_schema.h
  - spf_header.h
  - file.h
  - file_open_status.h
  - express.h
  - instance_data.h
  - schema.h

handles:
  - name: file
    cpp_type: ifcopenshell::file
    c_type: ifcopenshell_ifc_file_t
    destructor: delete
  - name: instance_streamer
    cpp_type: ifcopenshell::instance_streamer<>
    c_type: ifcopenshell_ifc_instance_streamer_t
    destructor: delete
  - name: instance
    cpp_type: express::Base
    c_type: ifcopenshell_ifc_instance_t
    destructor: none
    ptr_type: value
    empty_check: "!static_cast<bool>({value})"
  - name: header
    cpp_type: ifcopenshell::spf_header
    c_type: ifcopenshell_ifc_header_t
    destructor: none
  - name: file_description
    cpp_type: Header_section_schema::file_description
    c_type: ifcopenshell_ifc_file_description_t
    destructor: none
    ptr_type: value
    empty_check: "!static_cast<bool>({value})"
  - name: file_name
    cpp_type: Header_section_schema::file_name
    c_type: ifcopenshell_ifc_file_name_t
    destructor: none
    ptr_type: value
    empty_check: "!static_cast<bool>({value})"
  - name: file_schema
    cpp_type: Header_section_schema::file_schema
    c_type: ifcopenshell_ifc_file_schema_t
    destructor: none
    ptr_type: value
    empty_check: "!static_cast<bool>({value})"
  - name: declaration
    cpp_type: ifcopenshell::declaration
    c_type: ifcopenshell_ifc_declaration_t
    destructor: none
  - name: type_declaration
    cpp_type: ifcopenshell::type_declaration
    c_type: ifcopenshell_ifc_type_declaration_t
    destructor: none
  - name: select_type
    cpp_type: ifcopenshell::select_type
    c_type: ifcopenshell_ifc_select_type_t
    destructor: none
  - name: schema
    cpp_type: ifcopenshell::schema_definition
    c_type: ifcopenshell_ifc_schema_t
    destructor: none
  - name: enumeration
    cpp_type: ifcopenshell::enumeration_type
    c_type: ifcopenshell_ifc_enumeration_t
    destructor: none
  - name: parameter_type
    cpp_type: ifcopenshell::parameter_type
    c_type: ifcopenshell_ifc_parameter_type_t
    destructor: none
  - name: named_type
    cpp_type: ifcopenshell::named_type
    c_type: ifcopenshell_ifc_named_type_t
    destructor: none
  - name: simple_type
    cpp_type: ifcopenshell::simple_type
    c_type: ifcopenshell_ifc_simple_type_t
    destructor: none
  - name: aggregation_type
    cpp_type: ifcopenshell::aggregation_type
    c_type: ifcopenshell_ifc_aggregation_type_t
    destructor: none
  - name: entity
    cpp_type: ifcopenshell::entity
    c_type: ifcopenshell_ifc_entity_t
    destructor: none
  - name: attribute
    cpp_type: ifcopenshell::attribute
    c_type: ifcopenshell_ifc_attribute_t
    destructor: none
  - name: inverse_attribute
    cpp_type: ifcopenshell::inverse_attribute
    c_type: ifcopenshell_ifc_inverse_attribute_t
    destructor: none
  - name: attribute_value
    cpp_type: attribute_value
    c_type: ifcopenshell_ifcparse_attribute_value_t
    destructor: none
    ptr_type: value
  - name: instance_list
    cpp_type: std::vector<express::Base>
    c_type: ifcopenshell_ifcparse_instance_list_t
    destructor: none
    ptr_type: value

discover:
  include_dir: ../../../ifcparse
  class_defaults:
    include_all: true
  function_defaults:
    include_all: true
  classes:
    - handle: file
      translation_unit: file.cpp
      exclude:
        - header
        - begin
        - end
        - get_inverse
        - get_unit
        - good
        - internal_guid_map
        - instances_by_type
        - instances_by_type_excl_subtypes
        - register_inverse
        - types_begin
        - types_end
        - unregister_inverse
      rename:
        add_entity: add
        addEntities: add_entities
        add_type_ref: add_type_ref
        get_inverse_indices: get_inverse_indices_by_id
        instance_by_id: by_id
        instance_by_guid: by_guid
        get_total_inverses: get_total_inverses_by_id
        remove_type_ref: remove_type_ref
        remove_entity: remove
      overloads:
        - cpp_name: create
          expose_as: create
          params:
            - const ifcopenshell::declaration *
            - int
        - cpp_name: get_inverse
          expose_as: get_inverses_by_declaration
          params:
            - int
            - const ifcopenshell::declaration *
            - int
        - cpp_name: instances_by_type
          expose_as: by_type
          params:
            - const std::string &
        - cpp_name: instances_by_type_excl_subtypes
          expose_as: by_type_excl_subtypes
          params:
            - const std::string &
    - handle: instance
      translation_unit: parse.cpp
      exclude:
        - data
        - set_attribute_value
        - to_string
        - unset_attribute_value
      rename:
        get_attribute_value: get_argument
    - handle: schema
      translation_unit: schema.cpp
      exclude:
        - declaration_by_name
        - instantiate
      overloads:
        - cpp_name: declaration_by_name
          expose_as: declaration_by_name
          params:
            - const std::string &
        - cpp_name: declaration_by_name
          expose_as: declaration_by_index
          params:
            - size_t
    - handle: declaration
      translation_unit: schema.cpp
      exclude:
        - is
      overloads:
        - cpp_name: is
          expose_as: is_a
          params:
            - const std::string &
    - handle: type_declaration
      translation_unit: schema.cpp
    - handle: select_type
      translation_unit: schema.cpp
    - handle: enumeration
      translation_unit: schema.cpp
    - handle: parameter_type
      translation_unit: schema.cpp
      include_all: false
      include:
        - as_aggregation_type
        - as_named_type
        - as_simple_type
    - handle: named_type
      translation_unit: schema.cpp
      exclude:
        - is
      overloads:
        - cpp_name: is
          expose_as: is_a
          params:
            - const std::string &
    - handle: simple_type
      translation_unit: schema.cpp
    - handle: aggregation_type
      translation_unit: schema.cpp
      exclude:
        - type_of_aggregation
    - handle: header
      translation_unit: spf_header.cpp
      exclude:
        - owner_file
        - file_description
        - file_name
        - file_schema
        - write
      overloads:
        - cpp_name: owner_file
          expose_as: file
          params: []
        - cpp_name: file_description
          expose_as: file_description
          params: []
        - cpp_name: file_name
          expose_as: file_name
          params: []
        - cpp_name: file_schema
          expose_as: file_schema
          params: []
    - handle: file_description
      translation_unit: schemas/Header_section_schema.cpp
    - handle: file_name
      translation_unit: schemas/Header_section_schema.cpp
    - handle: file_schema
      translation_unit: schemas/Header_section_schema.cpp
    - handle: entity
      translation_unit: schema.cpp
      exclude:
        - attribute_index
      overloads:
        - cpp_name: attribute_index
          expose_as: attribute_index
          params:
            - const std::string &
    - handle: attribute
      translation_unit: schema.cpp
    - handle: inverse_attribute
      translation_unit: schema.cpp
      exclude:
        - type_of_aggregation
    - handle: instance_streamer
      translation_unit: file.cpp
      include_all: false
      include:
        - bypassed_instances
        - has_semicolon
        - push_page
        - semicolon_count
  functions:
    - namespace: ifcopenshell
      translation_unit: parse.cpp
      exclude:
        - GeneralTokenPtr
        - OperatorTokenPtr
        - get_SI_equivalent
    - namespace: ifcopenshell
      translation_unit: schema.cpp

functions:
  - kind: adapter_function
    expose_as: open
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: path
        type:
          kind: string
      - name: readonly
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        {
            std::ifstream probe(path_cpp.c_str());
            if (!probe.good()) {
                throw std::runtime_error(std::string("File does not exist or is not readable: ") + path_cpp);
            }
        }
        auto file = std::make_unique<ifcopenshell::file>(path_cpp, ifcopenshell::FT_AUTODETECT, readonly);
        if (!file->good()) {
            throw std::runtime_error(std::string("Failed to open IFC file: ") + path_cpp);
        }
        return file.release();

  - kind: adapter_function
    expose_as: open_bypass
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: path
        type:
          kind: string
      - name: type_names
        type:
          kind: string_list
    implementation:
      kind: inline_cpp
      body: |
        auto file = std::make_unique<ifcopenshell::file>(ifcopenshell::uninitialized_tag{});
        for (const auto& type_name : type_names_cpp) {
            file->bypass_type(type_name);
        }
        if (!file->initialize(path_cpp)) {
            throw std::runtime_error(std::string("Failed to open IFC file: ") + path_cpp);
        }
        return file.release();

  - kind: adapter_function
    expose_as: new_file
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: schema_identifier
        type:
          kind: string
      - name: file_type
        type:
          kind: int32
      - name: path
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const ifcopenshell::schema_definition* schema = ifcopenshell::schema_by_name(schema_identifier_cpp);
        return new ifcopenshell::file(schema, static_cast<ifcopenshell::filetype>(file_type), path_cpp);

  - kind: adapter_function
    expose_as: read
    c_expose_as: read_memory
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: data
        type:
          kind: opaque_ptr
          cpp_type: const void*
      - name: length
        type:
          kind: int32
    implementation:
      kind: inline_cpp
      body: |
        if (length < 0) {
            throw std::runtime_error("length is negative");
        }
        auto file = std::make_unique<ifcopenshell::file>(const_cast<void*>(data_cpp), static_cast<int>(length));
        if (!file->good()) {
            throw std::runtime_error("Failed to parse IFC data from string");
        }
        return file.release();

  - kind: adapter_function
    expose_as: stream
    returns:
      kind: handle
      handle: instance_streamer
      ownership: owned
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return new ifcopenshell::instance_streamer<>();

  - kind: adapter_function
    expose_as: stream_from_path
    returns:
      kind: handle
      handle: instance_streamer
      ownership: owned
    params:
      - name: path
        type:
          kind: string
      - name: mmap
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        #ifdef USE_MMAP
        return new ifcopenshell::instance_streamer<>(path_cpp, mmap);
        #else
        (void)mmap;
        return new ifcopenshell::instance_streamer<>(path_cpp, false);
        #endif

  - kind: adapter_function
    expose_as: stream_from_string
    returns:
      kind: handle
      handle: instance_streamer
      ownership: owned
    params:
      - name: data
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return new ifcopenshell::instance_streamer<>((void*)data_cpp.data(), static_cast<int>(data_cpp.size()));

  - kind: adapter_function
    expose_as: version
    returns:
      kind: string
      ownership: static
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return IFCOPENSHELL_VERSION;

  - kind: adapter_function
    expose_as: set_feature
    returns:
      kind: void
    params:
      - name: name
        type:
          kind: string
      - name: value
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        if (name_cpp == "use_attribute_value_derived") {
            feature_use_attribute_value_derived = value;
            return;
        }
        throw std::runtime_error("Invalid feature specification");

  - kind: adapter_function
    expose_as: get_feature
    returns:
      kind: bool
    params:
      - name: name
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        if (name_cpp == "use_attribute_value_derived") {
            return feature_use_attribute_value_derived;
        }
        throw std::runtime_error("Invalid feature specification");

  - kind: adapter_function
    expose_as: get_log
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        std::string log = ifcopenshell_log_stream.str();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        return log;

  - kind: adapter_function
    expose_as: turn_on_detailed_logging
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        logger::set_output(&std::cout, &std::cout);
        logger::verbosity(logger::LOG_DEBUG);

  - kind: adapter_function
    expose_as: turn_off_detailed_logging
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        logger::set_output(nullptr, &ifcopenshell_log_stream);
        logger::verbosity(logger::LOG_WARNING);

  - kind: adapter_function
    expose_as: instance_list_create_from_handles
    returns:
      kind: handle
      handle: instance_list
      ownership: owned
    params:
      - name: instances
        type:
          kind: handle_list
          handle: instance
    implementation:
      kind: inline_cpp
      body: |
        std::vector<express::Base> agg;
        agg.reserve(instances_cpp.size());
        for (const auto& inst : instances_cpp) {
            if (inst) {
                agg.push_back(inst);
            }
        }
        return agg;

  - kind: adapter_function
    expose_as: set_log_format_json
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        logger::output_format(logger::FMT_JSON);

  - kind: adapter_function
    expose_as: set_log_format_text
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        logger::output_format(logger::FMT_PLAIN);

  - kind: adapter_function
    expose_as: get_si_equivalent
    returns:
      kind: double
    params:
      - name: named_unit
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        if (!named_unit_cpp->declaration().is("IfcNamedUnit")) {
            throw ifcopenshell::exception("Instance is not an IfcNamedUnit.");
        }
        double scale = 1.0;
        express::Base si_unit;
        if (named_unit_cpp->declaration().is("IfcConversionBasedUnit")) {
            auto factor = static_cast<express::Base>(named_unit_cpp->get_attribute_value(
                named_unit_cpp->declaration().as_entity()->attribute_index("ConversionFactor")));
            auto value_component = static_cast<express::Base>(factor.get_attribute_value(
                factor.declaration().as_entity()->attribute_index("ValueComponent")));
            auto unit_component = static_cast<express::Base>(factor.get_attribute_value(
                factor.declaration().as_entity()->attribute_index("UnitComponent")));
            scale = static_cast<double>(value_component.get_attribute_value(0));
            if (unit_component.declaration().is("IfcSIUnit")) {
                si_unit = unit_component;
            }
        } else if (named_unit_cpp->declaration().is("IfcSIUnit")) {
            si_unit = *named_unit_cpp;
        }
        if (si_unit) {
            attribute_value prefix = si_unit.get_attribute_value(
                si_unit.declaration().as_entity()->attribute_index("Prefix"));
            if (!prefix.isNull()) {
                scale *= ifcopenshell::si_prefix_to_value(static_cast<std::string>(prefix));
            }
        } else {
            scale = 0.0;
        }
        return scale;

  - kind: adapter_function
    expose_as: get_info_cpp
    returns:
      kind: string
      ownership: copy
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: include_identifier
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        return instance_to_info_json_string(*instance_cpp, include_identifier);

  - kind: adapter_function
    expose_as: operator_token_ptr
    returns:
      kind: int32
    params:
      - name: start
        type:
          kind: size
      - name: data
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const char value = data_cpp.empty() ? '$' : data_cpp.front();
        return static_cast<int>(ifcopenshell::token(start, value).type);

  - kind: adapter_function
    expose_as: general_token_ptr
    returns:
      kind: int32
    params:
      - name: start
        type:
          kind: size
      - name: token
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<int>(ifcopenshell::token(start, ifcopenshell::token::Token_STRING, token_cpp).type);

methods:
  - kind: adapter_method
    receiver: file
    cpp_name: write
    expose_as: write
    returns:
      kind: void
    params:
      - name: path
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        std::ofstream stream(ifcopenshell::path::from_utf8(path_cpp).c_str());
        if (!stream.good()) {
            throw std::runtime_error("Failed to write to path: '" + path_cpp + "', check folder and file permissions.");
        }
        stream << (*self_cpp);

  - kind: adapter_method
    receiver: file
    cpp_name: storage_mode
    expose_as: storage_mode
    returns:
      kind: int32
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return std::visit([](auto& storage) -> int {
            using T = std::decay_t<decltype(storage)>;
            if constexpr (std::is_same_v<T, ifcopenshell::impl::in_memory_file_storage>) {
                return 0;
            } else if constexpr (std::is_same_v<T, ifcopenshell::impl::rocks_db_file_storage>) {
                return 1;
            }
            return -1;
        }, self_cpp->storage_);

  - kind: adapter_method
    receiver: file
    cpp_name: create_entity_by_name
    expose_as: create_entity_by_name
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: type_name
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const auto* schema = self_cpp->schema();
        const auto* decl = schema->declaration_by_name(type_name_cpp);
        if (!decl || (!decl->as_entity() && !decl->as_type_declaration() && !decl->as_enumeration_type())) {
            throw std::runtime_error("Declaration is not creatable");
        }
        auto entity = self_cpp->create(decl);
        if (!entity) {
            throw std::runtime_error("Failed to create entity");
        }
        return entity;

  - kind: adapter_method
    receiver: file
    cpp_name: create_entity_by_name_with_id
    expose_as: create_entity_by_name_with_id
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: type_name
        type:
          kind: string
      - name: id
        type:
          kind: uint32
    implementation:
      kind: inline_cpp
      body: |
        const auto* schema = self_cpp->schema();
        const auto* decl = schema->declaration_by_name(type_name_cpp);
        if (!decl || !decl->as_entity()) {
            throw std::runtime_error("Type declaration is not an entity");
        }
        auto entity = self_cpp->create(decl, static_cast<int>(id));
        if (!entity) {
            throw std::runtime_error("Failed to create entity with id");
        }
        return entity;

  - kind: adapter_method
    receiver: file
    cpp_name: add_entity
    expose_as: add_entity
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: id
        type:
          kind: uint32
    implementation:
      kind: inline_cpp
      body: |
        auto added = self_cpp->add_entity(*instance_cpp, id == 0 ? -1 : static_cast<int>(id));
        if (!added) {
            throw std::runtime_error("Failed to add entity");
        }
        return added;

  - kind: adapter_method
    receiver: file
    cpp_name: schema_name
    expose_as: schema_name
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        if (self_cpp->schema() == nullptr) {
            return std::string();
        }
        return self_cpp->schema()->name();

  - kind: adapter_method
    receiver: file
    cpp_name: get_inverse
    expose_as: get_inverse
    returns:
      kind: handle
      handle: instance_list
      ownership: owned
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        auto entity = instance_cpp->as<express::Entity>();
        if (entity) {
            return self_cpp->get_inverse(entity.id(), 0, -1);
        }
        throw ifcopenshell::exception("Only entities with ids are supported for get_inverse.");

  - kind: adapter_method
    receiver: file
    cpp_name: get_total_inverses
    expose_as: get_total_inverses
    returns:
      kind: int32
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        auto entity = instance_cpp->as<express::Entity>();
        if (entity) {
            return self_cpp->get_total_inverses(entity.id());
        }
        throw ifcopenshell::exception("Only entities with ids are supported for get_total_inverses.");

  - kind: adapter_method
    receiver: file
    cpp_name: types
    expose_as: types
    returns:
      kind: string_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        const size_t n = std::distance(self_cpp->types_begin(), self_cpp->types_end());
        std::vector<std::string> types;
        types.reserve(n);
        std::transform(self_cpp->types_begin(), self_cpp->types_end(), std::back_inserter(types), [](const ifcopenshell::declaration* decl) {
            return decl->name();
        });
        return types;

  - kind: adapter_method
    receiver: file
    cpp_name: to_string
    expose_as: to_string
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::ostringstream stream;
        stream << (*self_cpp);
        return stream.str();

  - kind: adapter_method
    receiver: file
    cpp_name: entity_names
    expose_as: entity_names
    returns:
      kind: uint32_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::vector<unsigned int> ids;
