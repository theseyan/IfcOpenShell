schema_version: 1
module: ifcopenshell
slice: ifcparse
c_prefix: ifcopenshell_ifcparse

public_headers:
  - ifc_parse_api.h
  - IfcParse.h
  - IfcSIPrefix.h
  - IfcLogger.h
  - Header_section_schema.h
  - IfcSpfHeader.h
  - IfcFile.h
  - file_open_status.h
  - IfcBaseClass.h
  - IfcSchema.h

handles:
  - name: file
    cpp_type: IfcParse::IfcFile
    c_type: ifcopenshell_ifc_file_t
    destructor: delete
  - name: instance_streamer
    cpp_type: IfcParse::InstanceStreamer
    c_type: ifcopenshell_ifc_instance_streamer_t
    destructor: delete
  - name: instance
    cpp_type: IfcUtil::IfcBaseClass
    c_type: ifcopenshell_ifc_instance_t
    destructor: delete
  - name: header
    cpp_type: IfcParse::IfcSpfHeader
    c_type: ifcopenshell_ifc_header_t
    destructor: none
  - name: file_description
    cpp_type: Header_section_schema::file_description
    c_type: ifcopenshell_ifc_file_description_t
    destructor: none
  - name: file_name
    cpp_type: Header_section_schema::file_name
    c_type: ifcopenshell_ifc_file_name_t
    destructor: none
  - name: file_schema
    cpp_type: Header_section_schema::file_schema
    c_type: ifcopenshell_ifc_file_schema_t
    destructor: none
  - name: declaration
    cpp_type: IfcParse::declaration
    c_type: ifcopenshell_ifc_declaration_t
    destructor: none
  - name: type_declaration
    cpp_type: IfcParse::type_declaration
    c_type: ifcopenshell_ifc_type_declaration_t
    destructor: none
  - name: select_type
    cpp_type: IfcParse::select_type
    c_type: ifcopenshell_ifc_select_type_t
    destructor: none
  - name: schema
    cpp_type: IfcParse::schema_definition
    c_type: ifcopenshell_ifc_schema_t
    destructor: none
  - name: enumeration
    cpp_type: IfcParse::enumeration_type
    c_type: ifcopenshell_ifc_enumeration_t
    destructor: none
  - name: parameter_type
    cpp_type: IfcParse::parameter_type
    c_type: ifcopenshell_ifc_parameter_type_t
    destructor: none
  - name: named_type
    cpp_type: IfcParse::named_type
    c_type: ifcopenshell_ifc_named_type_t
    destructor: none
  - name: simple_type
    cpp_type: IfcParse::simple_type
    c_type: ifcopenshell_ifc_simple_type_t
    destructor: none
  - name: aggregation_type
    cpp_type: IfcParse::aggregation_type
    c_type: ifcopenshell_ifc_aggregation_type_t
    destructor: none
  - name: entity
    cpp_type: IfcParse::entity
    c_type: ifcopenshell_ifc_entity_t
    destructor: none
  - name: attribute
    cpp_type: IfcParse::attribute
    c_type: ifcopenshell_ifc_attribute_t
    destructor: none
  - name: inverse_attribute
    cpp_type: IfcParse::inverse_attribute
    c_type: ifcopenshell_ifc_inverse_attribute_t
    destructor: none
  - name: attribute_value
    cpp_type: AttributeValue
    c_type: ifcopenshell_ifcparse_attribute_value_t
    destructor: delete
  - name: instance_list
    cpp_type: aggregate_of_instance
    c_type: ifcopenshell_ifcparse_instance_list_t
    destructor: delete

discover:
  include_dir: ../../../ifcparse
  class_defaults:
    include_all: true
  function_defaults:
    include_all: true
  classes:
    - handle: file
      translation_unit: IfcFile.cpp
      exclude:
        - header
        - begin
        - end
        - getInverse
        - getUnit
        - good
        - internal_guid_map
        - instances_by_type
        - instances_by_type_excl_subtypes
        - register_inverse
        - types_begin
        - types_end
        - unregister_inverse
      rename:
        addEntity: add
        addEntities: add_entities
        add_type_ref: add_type_ref
        get_inverse_indices: get_inverse_indices_by_id
        instance_by_id: by_id
        instance_by_guid: by_guid
        getTotalInverses: get_total_inverses_by_id
        remove_type_ref: remove_type_ref
        removeEntity: remove
      overloads:
        - cpp_name: create
          expose_as: create
          params:
            - const IfcParse::declaration *
        - cpp_name: getInverse
          expose_as: get_inverses_by_declaration
          params:
            - int
            - const IfcParse::declaration *
            - int
        - cpp_name: instances_by_type
          expose_as: by_type
          params:
            - const std::string &
        - cpp_name: instances_by_type_excl_subtypes
          expose_as: by_type_excl_subtypes
          params:
            - const std::string &
    - handle: instance
      translation_unit: IfcParse.cpp
      exclude:
        - data
        - set_attribute_value
        - toString
        - unset_attribute_value
      rename:
        get_attribute_value: get_argument
    - handle: schema
      translation_unit: IfcSchema.cpp
      exclude:
        - declaration_by_name
        - instantiate
      overloads:
        - cpp_name: declaration_by_name
          expose_as: declaration_by_name
          params:
            - const std::string &
        - cpp_name: declaration_by_name
          expose_as: declaration_by_index
          params:
            - size_t
    - handle: declaration
      translation_unit: IfcSchema.cpp
      exclude:
        - is
      overloads:
        - cpp_name: is
          expose_as: is_a
          params:
            - const std::string &
    - handle: type_declaration
      translation_unit: IfcSchema.cpp
    - handle: select_type
      translation_unit: IfcSchema.cpp
    - handle: enumeration
      translation_unit: IfcSchema.cpp
    - handle: parameter_type
      translation_unit: IfcSchema.cpp
      include_all: false
      include:
        - as_aggregation_type
        - as_named_type
        - as_simple_type
    - handle: named_type
      translation_unit: IfcSchema.cpp
      exclude:
        - is
      overloads:
        - cpp_name: is
          expose_as: is_a
          params:
            - const std::string &
    - handle: simple_type
      translation_unit: IfcSchema.cpp
      type_overrides:
        declared_type:
          returns:
            kind: int32
    - handle: aggregation_type
      translation_unit: IfcSchema.cpp
      exclude:
        - type_of_aggregation
    - handle: header
      translation_unit: IfcSpfHeader.cpp
      exclude:
        - file
        - file_description
        - file_name
        - file_schema
        - write
      overloads:
        - cpp_name: file
          expose_as: file
          params: []
        - cpp_name: file_description
          expose_as: file_description
          params: []
        - cpp_name: file_name
          expose_as: file_name
          params: []
        - cpp_name: file_schema
          expose_as: file_schema
          params: []
    - handle: file_description
      translation_unit: Header_section_schema.cpp
    - handle: file_name
      translation_unit: Header_section_schema.cpp
    - handle: file_schema
      translation_unit: Header_section_schema.cpp
    - handle: entity
      translation_unit: IfcSchema.cpp
      exclude:
        - attribute_index
      overloads:
        - cpp_name: attribute_index
          expose_as: attribute_index
          params:
            - const std::string &
    - handle: attribute
      translation_unit: IfcSchema.cpp
    - handle: inverse_attribute
      translation_unit: IfcSchema.cpp
      exclude:
        - type_of_aggregation
    - handle: instance_streamer
      translation_unit: IfcFile.cpp
      include_all: false
      include:
        - bypassed_instances
        - hasSemicolon
        - pushPage
        - semicolonCount
    - handle: instance_list
      translation_unit: IfcUtil.cpp
      include_all: false
      include:
        - size
  functions:
    - namespace: IfcParse
      translation_unit: IfcParse.cpp
      exclude:
        - IfcSIPrefixToValue
        - GeneralTokenPtr
        - OperatorTokenPtr
        - get_SI_equivalent
    - namespace: IfcParse
      translation_unit: IfcSchema.cpp

functions:
  - kind: adapter_function
    expose_as: open
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: path
        type:
          kind: string
      - name: readonly
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        return new IfcParse::IfcFile(path, IfcParse::FT_AUTODETECT, readonly);

  - kind: adapter_function
    expose_as: new_file
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: schema_identifier
        type:
          kind: string
      - name: file_type
        type:
          kind: int32
      - name: path
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const IfcParse::schema_definition* schema = IfcParse::schema_by_name(schema_identifier);
        return new IfcParse::IfcFile(schema, static_cast<IfcParse::filetype>(file_type), path);

  - kind: adapter_function
    expose_as: read
    c_expose_as: read_memory
    returns:
      kind: handle
      handle: file
      ownership: owned
    params:
      - name: data
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return new IfcParse::IfcFile((void*)data_cpp.data(), static_cast<int>(data_cpp.size()));

  - kind: adapter_function
    expose_as: stream_from_string
    returns:
      kind: handle
      handle: instance_streamer
      ownership: owned
    params:
      - name: data
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return new IfcParse::InstanceStreamer((void*)data_cpp.data(), static_cast<int>(data_cpp.size()));

  - kind: adapter_function
    expose_as: version
    returns:
      kind: string
      ownership: static
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return IFCOPENSHELL_VERSION;

  - kind: adapter_function
    expose_as: set_feature
    returns:
      kind: void
    params:
      - name: name
        type:
          kind: string
      - name: value
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        if (name_cpp == "use_attribute_value_derived") {
            feature_use_attribute_value_derived = value;
            return;
        }
        throw std::runtime_error("Invalid feature specification");

  - kind: adapter_function
    expose_as: get_feature
    returns:
      kind: bool
    params:
      - name: name
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        if (name_cpp == "use_attribute_value_derived") {
            return feature_use_attribute_value_derived;
        }
        throw std::runtime_error("Invalid feature specification");

  - kind: adapter_function
    expose_as: get_log
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        std::string log = ifcopenshell_log_stream.str();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        return log;

  - kind: adapter_function
    expose_as: turn_on_detailed_logging
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        Logger::SetOutput(&std::cout, &std::cout);
        Logger::Verbosity(Logger::LOG_DEBUG);

  - kind: adapter_function
    expose_as: turn_off_detailed_logging
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        Logger::SetOutput(nullptr, &ifcopenshell_log_stream);
        Logger::Verbosity(Logger::LOG_WARNING);

  - kind: adapter_function
    expose_as: instance_list_create_from_handles
    returns:
      kind: handle
      handle: instance_list
      ownership: owned
    params:
      - name: instances
        type:
          kind: handle_list
          handle: instance
    implementation:
      kind: inline_cpp
      body: |
        boost::shared_ptr<aggregate_of_instance> agg(new aggregate_of_instance());
        agg->reserve(instances_cpp.size());
        for (const auto* inst : instances_cpp) {
            if (inst != nullptr) {
                agg->push(const_cast<IfcUtil::IfcBaseClass*>(inst));
            }
        }
        return agg;

  - kind: adapter_function
    expose_as: set_log_format_json
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        Logger::OutputFormat(Logger::FMT_JSON);

  - kind: adapter_function
    expose_as: set_log_format_text
    returns:
      kind: void
    params: []
    implementation:
      kind: inline_cpp
      body: |
        ensure_log_stream_initialized();
        ifcopenshell_log_stream.str("");
        ifcopenshell_log_stream.clear();
        Logger::OutputFormat(Logger::FMT_PLAIN);

  - kind: adapter_function
    expose_as: ifc_si_prefix_to_value
    returns:
      kind: double
    params:
      - name: prefix
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return IfcParse::IfcSIPrefixToValue(prefix_cpp);

  - kind: adapter_function
    expose_as: get_si_equivalent
    returns:
      kind: double
    params:
      - name: named_unit
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        if (!named_unit_cpp->declaration().is("IfcNamedUnit")) {
            throw IfcParse::IfcException("Instance is not an IfcNamedUnit.");
        }
        double scale = 1.0;
        IfcUtil::IfcBaseClass* si_unit = nullptr;
        if (named_unit_cpp->declaration().is("IfcConversionBasedUnit")) {
            auto* factor = static_cast<IfcUtil::IfcBaseClass*>(named_unit_cpp->get_attribute_value(
                named_unit_cpp->declaration().as_entity()->attribute_index("ConversionFactor")));
            auto* value_component = static_cast<IfcUtil::IfcBaseClass*>(factor->get_attribute_value(
                factor->declaration().as_entity()->attribute_index("ValueComponent")));
            auto* unit_component = static_cast<IfcUtil::IfcBaseClass*>(factor->get_attribute_value(
                factor->declaration().as_entity()->attribute_index("UnitComponent")));
            scale = static_cast<double>(value_component->get_attribute_value(0));
            if (unit_component->declaration().is("IfcSIUnit")) {
                si_unit = unit_component;
            }
        } else if (named_unit_cpp->declaration().is("IfcSIUnit")) {
            si_unit = named_unit_cpp;
        }
        if (si_unit != nullptr) {
            AttributeValue prefix = si_unit->get_attribute_value(
                si_unit->declaration().as_entity()->attribute_index("Prefix"));
            if (!prefix.isNull()) {
                scale *= IfcParse::IfcSIPrefixToValue(static_cast<std::string>(prefix));
            }
        } else {
            scale = 0.0;
        }
        return scale;

  - kind: adapter_function
    expose_as: get_info_cpp
    returns:
      kind: string
      ownership: copy
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: include_identifier
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        return instance_to_info_json_string(instance_cpp, include_identifier);

  - kind: adapter_function
    expose_as: operator_token_ptr
    returns:
      kind: int32
    params:
      - name: start
        type:
          kind: size
      - name: data
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const char value = data_cpp.empty() ? '$' : data_cpp.front();
        return static_cast<int>(IfcParse::OperatorTokenPtr(nullptr, start, value).type);

  - kind: adapter_function
    expose_as: general_token_ptr
    returns:
      kind: int32
    params:
      - name: start
        type:
          kind: size
      - name: token
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<int>(IfcParse::GeneralTokenPtr(nullptr, start, token_cpp).type);

  - kind: adapter_function
    expose_as: new_IfcBaseClass
    c_expose_as: new_instance
    returns:
      kind: handle
      handle: instance
      ownership: owned
    params:
      - name: schema_identifier
        type:
          kind: string
      - name: declaration_name
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        const IfcParse::schema_definition* schema = IfcParse::schema_by_name(schema_identifier_cpp);
        const IfcParse::declaration* decl = schema->declaration_by_name(declaration_name_cpp);
        IfcEntityInstanceData data(in_memory_attribute_storage(decl->as_entity() ? decl->as_entity()->attribute_count() : 1));
        auto* inst = schema->instantiate(decl, std::move(data));
        if (auto* entinst = inst->as<IfcUtil::IfcBaseEntity>()) {
            entinst->populate_derived();
        }
        return inst;

methods:
  - kind: adapter_method
    receiver: file
    cpp_name: write
    expose_as: write
    returns:
      kind: void
    params:
      - name: path
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        std::ofstream stream(IfcUtil::path::from_utf8(path_cpp).c_str());
        if (!stream.good()) {
            throw std::runtime_error("Failed to write to path: '" + path_cpp + "', check folder and file permissions.");
        }
        stream << (*self_cpp);

  - kind: adapter_method
    receiver: file
    cpp_name: storage_mode
    expose_as: storage_mode
    returns:
      kind: int32
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return std::visit([](auto& storage) -> int {
            using T = std::decay_t<decltype(storage)>;
            if constexpr (std::is_same_v<T, IfcParse::impl::in_memory_file_storage>) {
                return 0;
            } else if constexpr (std::is_same_v<T, IfcParse::impl::rocks_db_file_storage>) {
                return 1;
            }
            return -1;
        }, self_cpp->storage_);

  - kind: adapter_method
    receiver: file
    cpp_name: schema_name
    expose_as: schema_name
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        if (self_cpp->schema() == nullptr) {
            return std::string();
        }
        return self_cpp->schema()->name();

  - kind: adapter_method
    receiver: file
    cpp_name: get_inverse
    expose_as: get_inverse
    returns:
      kind: handle
      handle: instance_list
      ownership: owned
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        if (auto* entity = instance_cpp->as<IfcUtil::IfcBaseEntity>()) {
            return self_cpp->getInverse(entity->id(), 0, -1);
        }
        throw IfcParse::IfcException("Only entities with ids are supported for get_inverse.");

  - kind: adapter_method
    receiver: file
    cpp_name: get_total_inverses
    expose_as: get_total_inverses
    returns:
      kind: int32
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        if (auto* entity = instance_cpp->as<IfcUtil::IfcBaseEntity>()) {
            return self_cpp->getTotalInverses(entity->id());
        }
        throw IfcParse::IfcException("Only entities with ids are supported for get_total_inverses.");

  - kind: adapter_method
    receiver: file
    cpp_name: types
    expose_as: types
    returns:
      kind: string_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        const size_t n = std::distance(self_cpp->types_begin(), self_cpp->types_end());
        std::vector<std::string> types;
        types.reserve(n);
        std::transform(self_cpp->types_begin(), self_cpp->types_end(), std::back_inserter(types), [](const IfcParse::declaration* decl) {
            return decl->name();
        });
        return types;

  - kind: adapter_method
    receiver: file
    cpp_name: to_string
    expose_as: to_string
    returns:
      kind: string
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::ostringstream stream;
        stream << (*self_cpp);
        return stream.str();

  - kind: adapter_method
    receiver: file
    cpp_name: entity_names
    expose_as: entity_names
    returns:
      kind: uint32_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::vector<unsigned int> ids;
        ids.reserve(std::distance(self_cpp->begin(), self_cpp->end()));
        for (auto it = self_cpp->begin(); it != self_cpp->end(); ++it) {
            ids.push_back(it->first);
        }
        return ids;

  - kind: adapter_method
    receiver: file
    cpp_name: file_pointer
    expose_as: file_pointer
    returns:
      kind: size
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return reinterpret_cast<size_t>(self_cpp);

  - kind: adapter_method
    receiver: file
    cpp_name: get_inverse_indices
    expose_as: get_inverse_indices
    returns:
      kind: int32_list
      ownership: copy
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        if (auto* entity = instance_cpp->as<IfcUtil::IfcBaseEntity>()) {
            return self_cpp->get_inverse_indices(entity->id());
        }
        throw IfcParse::IfcException("Only entities with ids are supported for get_inverse_indices.");

  - kind: adapter_method
    receiver: file
    cpp_name: good
    expose_as: good
    returns:
      kind: int32
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<int>(self_cpp->good().value());

  - kind: adapter_method
    receiver: file
    cpp_name: getUnit
    expose_as: get_unit
    returns:
      kind: double
    params:
      - name: unit_type
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return self_cpp->getUnit(unit_type_cpp).second;

  - kind: adapter_method
    receiver: file
    cpp_name: key_value_store_query
    expose_as: key_value_store_query
    returns:
      kind: string
      ownership: copy
    params:
      - name: key
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        auto* storage = std::visit([](auto& value) -> const IfcParse::impl::rocks_db_file_storage* {
            using T = std::decay_t<decltype(value)>;
            if constexpr (std::is_same_v<T, IfcParse::impl::rocks_db_file_storage>) {
                return &value;
            }
            return nullptr;
        }, self_cpp->storage_);
        if (!storage) {
            return std::string();
        }
        #ifdef IFOPSH_WITH_ROCKSDB
        std::string value;
        if (storage->db->Get(storage->ropts, key_cpp, &value) != rocksdb::Status::OK()) {
            return std::string();
        }
        return value;
        #else
        return std::string();
        #endif

  - kind: adapter_method
    receiver: file
    cpp_name: key_value_store_iter
    expose_as: key_value_store_iter
    returns:
      kind: string_list
      ownership: copy
    params:
      - name: prefix
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        std::vector<std::string> values;
        auto* storage = std::visit([](auto& value) -> const IfcParse::impl::rocks_db_file_storage* {
            using T = std::decay_t<decltype(value)>;
            if constexpr (std::is_same_v<T, IfcParse::impl::rocks_db_file_storage>) {
                return &value;
            }
            return nullptr;
        }, self_cpp->storage_);
        if (!storage) {
            return values;
        }
        #ifdef IFOPSH_WITH_ROCKSDB
        std::unique_ptr<rocksdb::Iterator> iterator(storage->db->NewIterator(storage->ropts));
        const rocksdb::Slice prefix_slice(prefix_cpp);
        for (iterator->Seek(prefix_cpp); iterator->Valid() && iterator->key().starts_with(prefix_slice); iterator->Next()) {
            values.push_back(iterator->key().ToString());
        }
        #endif
        return values;

