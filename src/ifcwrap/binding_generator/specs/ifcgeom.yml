    expose_as: select_element
    c_name: ifcopenshell_ifcgeom_tree_select_element
    returns:
      kind: handle
      handle: instance_list
      ownership: owned
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: completely_within
        type:
          kind: bool
      - name: extend
        type:
          kind: double
    implementation:
      kind: inline_cpp
      body: |
        auto* entity = instance_cpp->as<IfcUtil::IfcBaseEntity>();
        if (!entity) {
            throw std::runtime_error("Instance should be an IfcProduct entity");
        }
        auto selected = self_cpp->select(entity, completely_within, extend);
        auto result = aggregate_of_instance::ptr(new aggregate_of_instance());
        result->reserve(selected.size());
        for (auto* item : selected) {
            result->push(const_cast<IfcUtil::IfcBaseEntity*>(item));
        }
        return result;

