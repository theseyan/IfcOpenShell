  - kind: adapter_method
    receiver: triangulation
    expose_as: colors_buffer
    c_name: ifcopenshell_ifcgeom_triangulation_colors_buffer
    returns:
      kind: double_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::vector<double> clrs;
        clrs.reserve(self_cpp->materials().size() * 4);
        for (auto& mptr : self_cpp->materials()) {
            auto& m = *mptr;
            if (m.diffuse) {
                clrs.push_back(m.diffuse.ccomponents()[0]);
                clrs.push_back(m.diffuse.ccomponents()[1]);
                clrs.push_back(m.diffuse.ccomponents()[2]);
            } else {
                clrs.push_back(0.);
                clrs.push_back(0.);
                clrs.push_back(0.);
            }
            if (m.has_transparency()) {
                clrs.push_back(1. - m.transparency);
            } else {
                clrs.push_back(1.);
            }
        }
        return clrs;

  - kind: adapter_method
    receiver: triangulation
    expose_as: colors_buffer_size
    c_name: ifcopenshell_ifcgeom_triangulation_colors_buffer_size
    returns:
      kind: size
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return self_cpp->materials().size() * 4;

  # Taxonomy matrix4 methods
  - kind: adapter_method
    receiver: taxonomy_matrix4
    expose_as: get_data
    c_name: ifcopenshell_ifcgeom_taxonomy_matrix4_get_data
    returns:
      kind: double_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::vector<double> data(16);
        const auto& mat = self_cpp->ccomponents();
        for (int i = 0; i < 4; ++i) {
            for (int j = 0; j < 4; ++j) {
                data[i * 4 + j] = mat(i, j);
            }
        }
        return data;

