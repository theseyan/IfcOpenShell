# IfcGeom C API Binding Specification
# This spec defines the C API surface for ifcgeom module.
schema_version: 1
module: ifcopenshell
slice: ifcgeom
c_prefix: ifcopenshell_ifcgeom

public_headers:
  - ifc_geom_api.h
  - Iterator.h
  - IfcGeomElement.h
  - IfcGeomRepresentation.h
  - ConversionSettings.h
  - GeometrySerializer.h
  - WavefrontObjSerializer.h
  - TtlWktSerializer.h
  - SvgSerializer.h
  - HdfSerializer.h
  - ColladaSerializer.h
  - GltfSerializer.h
  - JsonSerializer.h
  - XmlSerializer.h
  - IgesSerializer.h
  - StepSerializer.h
  - RocksDbSerializer.h
  - Serializer.h
  - kernels/opencascade/IfcGeomTree.h
  - <BRepTools_ShapeSet.hxx>
  - taxonomy.h
  - hybrid_kernel.h
  - Converter.h
  - abstract_mapping.h
  - function_item_evaluator.h
  - Serialization/Serialization.h
  - ../svgfill/src/svgfill.h

handles:
  # === Core Iteration ===
  - name: iterator
    cpp_type: IfcGeom::Iterator
    c_type: ifcopenshell_ifcgeom_iterator_t
    destructor: delete

  - name: settings
    cpp_type: ifcopenshell::geometry::Settings
    c_type: ifcopenshell_ifcgeom_settings_t
    destructor: delete

  - name: serializer_settings
    cpp_type: ifcopenshell::geometry::SerializerSettings
    c_type: ifcopenshell_ifcgeom_serializer_settings_t
    destructor: delete

  - name: geometry_serializer
    cpp_type: GeometrySerializer
    c_type: ifcopenshell_ifcgeom_geometry_serializer_t
    destructor: delete

  - name: serializer
    cpp_type: Serializer
    c_type: ifcopenshell_ifcgeom_serializer_t
    destructor: delete

  - name: buffer
    cpp_type: stream_or_filename
    c_type: ifcopenshell_ifcgeom_buffer_t
    destructor: delete

  - name: tree
    cpp_type: IfcGeom::tree
    c_type: ifcopenshell_ifcgeom_tree_t
    destructor: delete

  - name: tree_clash_list
    cpp_type: std::vector<IfcGeom::clash>
    c_type: ifcopenshell_ifcgeom_tree_clash_list_t
    destructor: delete
    list_accessors:
      receiver: tree
      list_param: clashes
      item_handle: tree_clash
      count_as: clash_count
      at_as: clash_at
      out_of_range_message: Clash index out of range

  - name: tree_clash
    cpp_type: IfcGeom::clash
    c_type: ifcopenshell_ifcgeom_tree_clash_t
    destructor: delete

  - name: tree_ray_intersection_list
    cpp_type: std::vector<IfcGeom::ray_intersection_result>
    c_type: ifcopenshell_ifcgeom_tree_ray_intersection_list_t
    destructor: delete
    list_accessors:
      receiver: tree
      list_param: intersections
      item_handle: tree_ray_intersection
      count_as: ray_intersection_count
      at_as: ray_intersection_at
      out_of_range_message: Ray intersection index out of range

  - name: tree_ray_intersection
    cpp_type: IfcGeom::ray_intersection_result
    c_type: ifcopenshell_ifcgeom_tree_ray_intersection_t
    destructor: delete

  # === Transformation ===
  - name: transformation
    cpp_type: IfcGeom::Transformation
    c_type: ifcopenshell_ifcgeom_transformation_t
    destructor: delete

  # === Element Types ===
  # Elements from the Iterator are borrowed; from create_shape they are owned.
  # Callers must only destroy elements they own.
  - name: element
    cpp_type: IfcGeom::Element
    c_type: ifcopenshell_ifcgeom_element_t
    destructor: delete

  - name: brep_element
    cpp_type: IfcGeom::BRepElement
    c_type: ifcopenshell_ifcgeom_brep_element_t
    destructor: delete

  - name: triangulation_element
    cpp_type: IfcGeom::TriangulationElement
    c_type: ifcopenshell_ifcgeom_triangulation_element_t
    destructor: delete

  - name: serialized_element
    cpp_type: IfcGeom::SerializedElement
    c_type: ifcopenshell_ifcgeom_serialized_element_t
    destructor: delete

  # === Representations ===
  - name: triangulation
    cpp_type: IfcGeom::Representation::Triangulation
    c_type: ifcopenshell_ifcgeom_triangulation_t
    destructor: none

  - name: brep_representation
    cpp_type: IfcGeom::Representation::BRep
    c_type: ifcopenshell_ifcgeom_brep_representation_t
    destructor: none

  - name: serialization
    cpp_type: IfcGeom::Representation::Serialization
    c_type: ifcopenshell_ifcgeom_serialization_t
    destructor: none

  - name: conversion_result_shape
    cpp_type: IfcGeom::ConversionResultShape
    c_type: ifcopenshell_ifcgeom_conversion_result_shape_t
    destructor: delete

  # === CGAL Exact Numbers ===
  - name: opaque_number
    cpp_type: IfcGeom::OpaqueNumber
    c_type: ifcopenshell_ifcgeom_opaque_number_t
    destructor: delete

  # === SVGFill Types ===
  - name: svgfill_polygon
    cpp_type: svgfill::polygon_2
    c_type: ifcopenshell_ifcgeom_svgfill_polygon_t
    destructor: delete

  # === Function Item Evaluator ===
  - name: function_item_evaluator
    cpp_type: ifcopenshell::geometry::function_item_evaluator
    c_type: ifcopenshell_ifcgeom_function_item_evaluator_t
    destructor: delete

handle_families:
  # === Taxonomy Types (shared_ptr-based) ===
  - namespace: ifcopenshell::geometry::taxonomy
    prefix: taxonomy
    c_prefix: ifcopenshell_ifcgeom_taxonomy
    destructor: shared_ptr
    ptr_type: shared_ptr
    validate_against:
      header: taxonomy.h
      marker_macro: DECLARE_PTR
    types:
      - item
      - matrix4
      - point3
      - direction3
      - style
      - colour
      - line
      - circle
      - ellipse
      - bspline_curve
      - offset_curve
      - edge
      - loop
      - face
      - shell
      - solid
      - plane
      - cylinder
      - sphere
      - torus
      - bspline_surface
      - collection
      - loft
      - extrusion
      - revolve
      - sweep_along_curve
      - node
      - boolean_result

discover:
  include_dir: ../../../ifcgeom
  class_defaults:
    include_all: true
  functions:
    - namespace: ifcopenshell::geometry
      translation_unit: function_item_evaluator.cpp
      include_all: false
      include:
        - helmert_curve_point
  constructors:
    - handle: serializer
      cpp_class: XmlSerializer
      translation_unit: ../serializers/XmlSerializer.cpp
      expose_as: create_xml_serializer
      params:
        - IfcParse::IfcFile*
        - const std::string&
      param_renames:
        xml_filename: filename
    - handle: tree
      cpp_class: IfcGeom::tree
      translation_unit: kernels/opencascade/boolean_utils.cpp
      expose_as: create_tree
      params: []
    - handle: tree
      cpp_class: IfcGeom::tree
      translation_unit: kernels/opencascade/boolean_utils.cpp
      expose_as: create_tree_from_file
      params:
        - IfcParse::IfcFile&
      param_renames:
        f: file
    - handle: tree
      cpp_class: IfcGeom::tree
      translation_unit: kernels/opencascade/boolean_utils.cpp
      expose_as: create_tree_from_file_with_settings
      params:
        - IfcParse::IfcFile&
        - ifcopenshell::geometry::Settings
      param_renames:
        f: file
    - handle: tree
      cpp_class: IfcGeom::tree
      translation_unit: kernels/opencascade/boolean_utils.cpp
      expose_as: create_tree_from_iterator
      params:
        - IfcGeom::Iterator&
      param_renames:
        it: iterator
    - handle: geometry_serializer
      cpp_class: WaveFrontOBJSerializer
      translation_unit: ../serializers/WavefrontObjSerializer.cpp
      expose_as: create_obj_serializer
      param_renames:
        obj_filename: obj_output
        mtl_filename: mtl_output
        settings: serializer_settings
    - handle: geometry_serializer
      cpp_class: TtlWktSerializer
      translation_unit: ../serializers/TtlWktSerializer.cpp
      expose_as: create_ttl_serializer
      param_renames:
        filename: output
        settings: serializer_settings
    - handle: geometry_serializer
      cpp_class: SvgSerializer
      translation_unit: ../serializers/SvgSerializer.cpp
      expose_as: create_svg_serializer
      param_renames:
        out_filename: output
        settings: serializer_settings
    - handle: geometry_serializer
      cpp_class: GltfSerializer
      translation_unit: ../serializers/GltfSerializer.cpp
      expose_as: create_gltf_serializer
      compile_guard: WITH_GLTF
      params:
        - const std::string&
        - const ifcopenshell::geometry::Settings&
        - const ifcopenshell::geometry::SerializerSettings&
      param_names:
        - filename
        - geometry_settings
        - serializer_settings
    - handle: geometry_serializer
      cpp_class: IgesSerializer
      translation_unit: ../serializers/OpenCascadeBasedSerializer.cpp
      expose_as: create_iges_serializer
      compile_guard: IFOPSH_WITH_OPENCASCADE
      params:
        - const std::string&
        - const ifcopenshell::geometry::Settings&
        - const ifcopenshell::geometry::SerializerSettings&
      param_names:
        - filename
        - geometry_settings
        - serializer_settings
    - handle: geometry_serializer
      cpp_class: StepSerializer
      translation_unit: ../serializers/OpenCascadeBasedSerializer.cpp
      expose_as: create_step_serializer
      compile_guard: IFOPSH_WITH_OPENCASCADE
      params:
        - const std::string&
        - const ifcopenshell::geometry::Settings&
        - const ifcopenshell::geometry::SerializerSettings&
      param_names:
        - filename
        - geometry_settings
        - serializer_settings
    - handle: geometry_serializer
      cpp_class: ColladaSerializer
      translation_unit: ../serializers/ColladaSerializer.cpp
      expose_as: create_collada_serializer
      compile_guard: WITH_OPENCOLLADA
      params:
        - const std::string&
        - const ifcopenshell::geometry::Settings&
        - const ifcopenshell::geometry::SerializerSettings&
      param_names:
        - filename
        - geometry_settings
        - serializer_settings
    - handle: geometry_serializer
      cpp_class: HdfSerializer
      translation_unit: ../serializers/HdfSerializer.cpp
      expose_as: create_hdf_serializer
      compile_guard: "defined(WITH_HDF5) && defined(IFOPSH_WITH_OPENCASCADE)"
      params:
        - const std::string&
        - const ifcopenshell::geometry::Settings&
        - const ifcopenshell::geometry::SerializerSettings&
      param_names:
        - filename
        - geometry_settings
        - serializer_settings
    - handle: serializer
      cpp_class: JsonSerializer
      translation_unit: ../serializers/JsonSerializer.cpp
      expose_as: create_json_serializer
      compile_guard: WITH_GLTF
      compile_guard_message: JSON serializer requires GLTF support (nlohmann_json)
      params:
        - IfcParse::IfcFile*
        - const std::string&
      param_names:
        - file
        - filename
    - handle: serializer
      cpp_class: RocksDbSerializer
      translation_unit: ../serializers/RocksDbSerializer.cpp
      expose_as: create_rocksdb_serializer
      compile_guard: IFOPSH_WITH_ROCKSDB
      compile_guard_message: RocksDB serializer requires WITH_ROCKSDB support
      params:
        - IfcParse::IfcFile*
        - const std::string&
      param_names:
        - file
        - rocksdb_filename
    - handle: serializer
      cpp_class: RocksDbSerializer
      translation_unit: ../serializers/RocksDbSerializer.cpp
      expose_as: create_rocksdb_serializer_streaming
      compile_guard: IFOPSH_WITH_ROCKSDB
      params:
        - const std::string&
        - const std::string&
        - bool
      param_names:
        - input_filename
        - rocksdb_filename
        - stream
    - handle: buffer
      cpp_class: stream_or_filename
      translation_unit: Iterator.cpp
      expose_as: create_buffer
      params: []
    - handle: buffer
      cpp_class: stream_or_filename
      translation_unit: Iterator.cpp
      expose_as: create_buffer_from_filename
      params:
        - const std::string&
      param_renames:
        fn: filename
    - handle: settings
      cpp_class: ifcopenshell::geometry::Settings
      translation_unit: Iterator.cpp
      expose_as: create_settings
    - handle: serializer_settings
      cpp_class: ifcopenshell::geometry::SerializerSettings
      translation_unit: Iterator.cpp
      expose_as: create_serializer_settings
    - handle: taxonomy_collection
      cpp_class: ifcopenshell::geometry::taxonomy::collection
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_collection
      factory: taxonomy_make
    - handle: taxonomy_loft
      cpp_class: ifcopenshell::geometry::taxonomy::loft
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_loft
      factory: taxonomy_make
    - handle: taxonomy_node
      cpp_class: ifcopenshell::geometry::taxonomy::node
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_node
      factory: taxonomy_make
    - handle: taxonomy_point3
      cpp_class: ifcopenshell::geometry::taxonomy::point3
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_point3
      factory: taxonomy_make
      params:
        - double
        - double
        - double
    - handle: taxonomy_bspline_curve
      cpp_class: ifcopenshell::geometry::taxonomy::bspline_curve
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_bspline_curve
      factory: taxonomy_make
      field_initializers:
        - field: degree
          min: 1
          error: B-spline curve degree must be >= 1
    - handle: taxonomy_bspline_surface
      cpp_class: ifcopenshell::geometry::taxonomy::bspline_surface
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_bspline_surface
      factory: taxonomy_make
      field_initializers:
        - field: degree
          params:
            - degree_u
            - degree_v
          min: 1
          error: B-spline surface degrees must be >= 1
    - handle: taxonomy_boolean_result
      cpp_class: ifcopenshell::geometry::taxonomy::boolean_result
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_boolean_result
      factory: taxonomy_make
      field_initializers:
        - field: operation
          min: 0
          max: 2
          error: Boolean operation must be 0 (UNION), 1 (SUBTRACTION), or 2 (INTERSECTION)
    - handle: taxonomy_offset_curve
      cpp_class: ifcopenshell::geometry::taxonomy::offset_curve
      translation_unit: Iterator.cpp
      expose_as: taxonomy_create_offset_curve
      factory: taxonomy_make
      field_initializers:
        - field: basis
        - field: reference
        - field: offset
  classes:
    - handle: triangulation
      translation_unit: IfcGeomRepresentation.cpp
      include_all: true
      exclude:
        - addFace
        - addEdge
        - addNormal
        - addVertex
        - box_project_uvs
        - empty
        - registerEdgeCount
        - registerEdge
        - resetWelds
        - uvs_ref
      method_sizes:
        verts: verts_buffer_size
        faces: faces_buffer_size
        normals: normals_buffer_size
        edges: edges_buffer_size
        material_ids: material_ids_buffer_size
        item_ids: item_ids_buffer_size
        edges_item_ids: edges_item_ids_buffer_size
        uvs: uvs_buffer_size
        materials: material_count
      method_at_accessors:
        - method: materials
          expose_as: material_at
          item_handle: taxonomy_style
          ownership: borrowed
          out_of_range_message: Material index out of bounds
          exception: std::runtime_error

    - handle: iterator
      translation_unit: Iterator.cpp
      include_all: true
      exclude:
        - bounds_min
        - bounds_max
        - filters
        - get_task_products
        - next
        - process_finished_rep
        - process_concurrently
        - set_cache
      rename:
        getLog: get_log

    - handle: brep_representation
      translation_unit: IfcGeomRepresentation.cpp
      include_all: true
      include_inherited_methods: true
      exclude:
        - begin
        - calculate_surface_area
        - calculate_volume
        - end
        - item
        - shapes

    - handle: element
      translation_unit: Iterator.cpp
      include_all: true
      exclude:
        - SetParents

    - handle: brep_element
      translation_unit: Iterator.cpp
      include_all: true
      exclude:
        - geometry_pointer

    - handle: triangulation_element
      translation_unit: Iterator.cpp
      include_all: true
      exclude:
        - geometry_pointer

    - handle: serialized_element
      translation_unit: Iterator.cpp
      include_all: true

    - handle: conversion_result_shape
      translation_unit: ConversionResult.cpp
      include_all: true
      exclude:
        - Triangulate
        - Serialize
        - area
        - bounding_box
        - convex_decomposition
        - length
        - map
        - plane_equation
        - position
        - volume
        - axis
      overloads:
        - cpp_name: solid
          expose_as: solid_mt
          params: []

    - handle: function_item_evaluator
      translation_unit: function_item_evaluator.cpp
      include_all: false
      overloads:
        - cpp_name: evaluation_points
          expose_as: evaluation_points
          params: []
        - cpp_name: evaluation_points
          expose_as: evaluation_points_range
          params:
            - double
            - double
            - unsigned int
        - cpp_name: evaluate
          expose_as: evaluate
          params: []
        - cpp_name: evaluate
          expose_as: evaluate_range
          params:
            - double
            - double
            - unsigned int
      type_overrides:
        "evaluation_points(double, double, unsigned int)":
          params:
            nsteps:
              kind: int32
        "evaluate(double, double, unsigned int)":
          params:
            nsteps:
              kind: int32

    - handle: serialization
      translation_unit: IfcGeomRepresentation.cpp
      include_all: true

    - handle: geometry_serializer
      translation_unit: ../serializers/WavefrontObjSerializer.cpp
      include_all: true
      include_inherited_methods: true
      exclude:
        - geometry_settings
        - object_id
        - settings
        - write
      rename:
        isTesselated: is_tesselated
        setUnitNameAndMagnitude: set_unit_name_and_magnitude
        writeHeader: write_header
        setFile: set_file
      overloads:
        - cpp_name: geometry_settings
          expose_as: geometry_settings
          params: []
        - cpp_name: settings
          expose_as: settings
          params: []
        - cpp_name: write
          expose_as: write_triangulation_element
          params:
            - "const IfcGeom::TriangulationElement *"
        - cpp_name: write
          expose_as: write_brep_element
          params:
            - "const IfcGeom::BRepElement *"

    - handle: taxonomy_circle
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_line
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      discover_as_item: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_plane
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_ellipse
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      rename:
        radius: radius1
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_style
      translation_unit: Iterator.cpp
      include_all: true
      discover_fields: true
      exclude:
        - instance
        - orientation
        - surface_style
        - clone_
        - calc_hash
        - reverse
        - kind
        - get_color
        - print

    - handle: taxonomy_sphere
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_torus
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_cylinder
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_extrusion
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_offset_curve
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      discover_as_item: true

    - handle: taxonomy_revolve
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      discover_optional_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_bspline_curve
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      discover_as_item: true
      discover_optional_fields: true
      exclude:
        - control_points
      discover_children:
        cpp_field: control_points

    - handle: taxonomy_sweep_along_curve
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      include_inherited_fields: true
      discover_has_fields: true
      exclude:
        - instance
        - orientation
        - surface_style

    - handle: taxonomy_face
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      discover_as_item: true
      extra_fields:
        matrix: "matrix4::ptr"
      discover_children: true

    - handle: taxonomy_loft
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      discover_has_fields: true
      field_setters:
        - axis
      discover_children:
        element_handle: taxonomy_item
        add_as: add_item
        add_cast_cpp_type: "ifcopenshell::geometry::taxonomy::geom_item"

    - handle: taxonomy_loop
      translation_unit: Iterator.cpp
      include_all: false
      discover_children: true

    - handle: taxonomy_shell
      translation_unit: Iterator.cpp
      include_all: false
      discover_children: true

    - handle: taxonomy_solid
      translation_unit: Iterator.cpp
      include_all: false
      extra_fields:
        matrix: "matrix4::ptr"
      discover_children: true

    - handle: taxonomy_collection
      translation_unit: Iterator.cpp
      include_all: false
      discover_children:
        element_handle: taxonomy_item
        add_as: add_item
        add_cast_cpp_type: "ifcopenshell::geometry::taxonomy::geom_item"

    - handle: taxonomy_boolean_result
      translation_unit: Iterator.cpp
      include_all: false
      discover_fields: true
      discover_children:
        element_handle: taxonomy_item
        add_as: add_item
        add_cast_cpp_type: "ifcopenshell::geometry::taxonomy::geom_item"

    - handle: taxonomy_bspline_surface
      translation_unit: Iterator.cpp
      include_all: false
      discover_as_item: true
      array_pair_fields:
        - degree
        - multiplicities
        - knots

    - handle: opaque_number
      translation_unit: ConversionResult.cpp
      include_all: true
      exclude:
        - clone_
      binary_operators:
        add: "+"
        subtract: "-"
        multiply: "*"
        divide: "/"
      unary_operators:
        negate: "-"
      comparison_operators:
        equals: "=="
        less_than: "<"

    - handle: serializer
      translation_unit: Iterator.cpp
      include_all: true
      rename:
        writeHeader: write_header
        setFile: set_file

    - handle: settings
      translation_unit: Iterator.cpp
      include_all: true
      include_inherited_methods: true
      exclude:
        - define_options
        - set
        - get
      variant_accessors:
        get_method: get
        set_method: set
        variant_type: "ifcopenshell::geometry::Settings::value_variant_t"
        types:
          bool: "bool"
          int:
            cpp_type: "int"
            getter_types:
              - "int"
              - "ifcopenshell::geometry::settings::IteratorOutputOptions"
              - "ifcopenshell::geometry::settings::FunctionStepMethod"
              - "ifcopenshell::geometry::settings::OutputDimensionalityTypes"
              - "ifcopenshell::geometry::settings::TriangulationMethod"
          double: "double"
          string: "std::string"
          int_set: "std::set<int>"
          string_set: "std::set<std::string>"
          double_list: "std::vector<double>"

    - handle: serializer_settings
      translation_unit: ../serializers/WavefrontObjSerializer.cpp
      include_all: true
      include_inherited_methods: true
      exclude:
        - define_options
        - set
        - get
      variant_accessors:
        get_method: get
        set_method: set
        variant_type: "ifcopenshell::geometry::SerializerSettings::value_variant_t"
        types:
          bool: "bool"
          int: "int"
          double: "double"
          string: "std::string"
          int_set: "std::set<int>"

    - handle: buffer
      translation_unit: ../serializers/WavefrontObjSerializer.cpp
      include_all: true
      exclude:
        - filename

    - handle: taxonomy_item
      translation_unit: Iterator.cpp
      include_all: true
      exclude:
        - clone_
        - reverse
        - calc_hash
        - print

    - handle: tree
      translation_unit: kernels/opencascade/boolean_utils.cpp
      include_all: true
      exclude:
        - add_element
        - add_file
        - enable_face_styles
        - select_ray
      overloads:
        - cpp_name: enable_face_styles
          expose_as: enable_face_styles
          params: []
        - cpp_name: enable_face_styles
          expose_as: set_enable_face_styles
          params: [bool]
        - cpp_name: add_file
          expose_as: add_file
          params: ["IfcParse::IfcFile &", "ifcopenshell::geometry::Settings"]
        - cpp_name: add_file
          expose_as: add_iterator
          params: ["IfcGeom::Iterator &"]
      method_sizes:
        styles: style_count
      method_at_accessors:
        - method: styles
          expose_as: style_at
          item_handle: taxonomy_style
          ownership: owned
          out_of_range_message: Style index out of range
          exception: std::out_of_range

    - handle: tree_clash
      translation_unit: kernels/opencascade/boolean_utils.cpp
      include_all: false
      discover_fields: true
      rename:
        clash_type: type

    - handle: tree_ray_intersection
      translation_unit: kernels/opencascade/boolean_utils.cpp
      include_all: false
      discover_fields: true
      exclude:
        - instance

    - handle: taxonomy_point3
      translation_unit: Iterator.cpp
      include_all: false
      ccomponents_accessor:
        expose_as: get_data

    - handle: taxonomy_direction3
      translation_unit: Iterator.cpp
      include_all: false
      ccomponents_accessor:
        expose_as: get_data

    - handle: taxonomy_matrix4
