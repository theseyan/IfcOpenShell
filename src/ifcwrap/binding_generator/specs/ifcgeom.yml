  - kind: adapter_method
    receiver: svgfill_polygon
    expose_as: inner_boundary_size
    c_name: ifcopenshell_ifcgeom_svgfill_polygon_inner_boundary_size
    returns:
      kind: size
    params:
      - name: boundary_index
        type:
          kind: size
    implementation:
      kind: inline_cpp
      body: |
        if (boundary_index >= self_cpp->inner_boundaries.size()) {
            throw std::runtime_error("Index out of bounds");
        }
        return self_cpp->inner_boundaries[boundary_index].size();

  - kind: adapter_method
    receiver: svgfill_polygon
    expose_as: inner_boundary_point
    c_name: ifcopenshell_ifcgeom_svgfill_polygon_inner_boundary_point
    returns:
