    params: []

  - kind: adapter_method
    receiver: function_item_evaluator
    expose_as: evaluate_range
    c_name: ifcopenshell_ifcgeom_function_item_evaluator_evaluate_range
    returns:
      kind: handle
      handle: taxonomy_item
      ownership: owned
    params:
      - name: ustart
        type:
          kind: double
      - name: uend
        type:
          kind: double
      - name: nsteps
        type:
          kind: int32
    implementation:
      kind: inline_cpp
      body: |
        return self_cpp->evaluate(ustart, uend, static_cast<unsigned>(nsteps));

  - kind: adapter_method
    receiver: function_item_evaluator
    expose_as: evaluate_at
    c_name: ifcopenshell_ifcgeom_function_item_evaluator_evaluate_at
    returns:
      kind: double_list
      ownership: copy
    params:
      - name: u
        type:
          kind: double
    implementation:
      kind: inline_cpp
      body: |
        Eigen::Matrix4d mat = self_cpp->evaluate(u);
        std::vector<double> result(16);
        for (int i = 0; i < 4; ++i)
            for (int j = 0; j < 4; ++j)
                result[i * 4 + j] = mat(i, j);
        return result;
