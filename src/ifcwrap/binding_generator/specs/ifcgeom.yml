  # Transformation methods
  - kind: adapter_method
    receiver: transformation
    expose_as: matrix
    c_name: ifcopenshell_ifcgeom_transformation_matrix
    returns:
      kind: double_list
      ownership: copy
    params: []
    implementation:
      kind: inline_cpp
      body: |
        std::vector<double> data(16);
        const auto& mat = self_cpp->data()->ccomponents();
        for (int i = 0; i < 4; ++i) {
            for (int j = 0; j < 4; ++j) {
                data[i * 4 + j] = mat(i, j);
            }
        }
        return data;

