# IfcGeom C API Binding Specification
# This spec defines the C API surface for ifcgeom module.
schema_version: 1
module: ifcopenshell
slice: ifcgeom
c_prefix: ifcopenshell_ifcgeom

public_headers:
  - ifc_geom_api.h
  - Iterator.h
  - IfcGeomElement.h
  - IfcGeomRepresentation.h
  - ConversionSettings.h
  - GeometrySerializer.h
  - WavefrontObjSerializer.h
  - TtlWktSerializer.h
  - SvgSerializer.h
  - HdfSerializer.h
  - ColladaSerializer.h
  - GltfSerializer.h
  - JsonSerializer.h
  - XmlSerializer.h
  - IgesSerializer.h
  - StepSerializer.h
  - RocksDbSerializer.h
  - Serializer.h
  - kernels/opencascade/IfcGeomTree.h
  - <BRepTools_ShapeSet.hxx>
  - taxonomy.h
  - hybrid_kernel.h
  - Converter.h
  - abstract_mapping.h
  - function_item_evaluator.h
  - Serialization/Serialization.h
  - ../svgfill/src/svgfill.h

handles:
  # === Core Iteration ===
  - name: iterator
    cpp_type: IfcGeom::Iterator
    c_type: ifcopenshell_ifcgeom_iterator_t
    destructor: delete

  - name: settings
    cpp_type: ifcopenshell::geometry::Settings
    c_type: ifcopenshell_ifcgeom_settings_t
    destructor: delete

  - name: serializer_settings
    cpp_type: ifcopenshell::geometry::SerializerSettings
    c_type: ifcopenshell_ifcgeom_serializer_settings_t
    destructor: delete

  - name: geometry_serializer
    cpp_type: GeometrySerializer
    c_type: ifcopenshell_ifcgeom_geometry_serializer_t
    destructor: delete

  - name: serializer
    cpp_type: Serializer
    c_type: ifcopenshell_ifcgeom_serializer_t
    destructor: delete

  - name: buffer
    cpp_type: stream_or_filename
    c_type: ifcopenshell_ifcgeom_buffer_t
    destructor: delete

  - name: tree
    cpp_type: IfcGeom::tree
    c_type: ifcopenshell_ifcgeom_tree_t
    destructor: delete

  - name: tree_clash_list
    cpp_type: std::vector<IfcGeom::clash>
    c_type: ifcopenshell_ifcgeom_tree_clash_list_t
    destructor: delete

  - name: tree_clash
    cpp_type: IfcGeom::clash
    c_type: ifcopenshell_ifcgeom_tree_clash_t
    destructor: delete

  - name: tree_ray_intersection_list
    cpp_type: std::vector<IfcGeom::ray_intersection_result>
    c_type: ifcopenshell_ifcgeom_tree_ray_intersection_list_t
    destructor: delete

  - name: tree_ray_intersection
    cpp_type: IfcGeom::ray_intersection_result
    c_type: ifcopenshell_ifcgeom_tree_ray_intersection_t
    destructor: delete

  # === Transformation ===
  - name: transformation
    cpp_type: IfcGeom::Transformation
    c_type: ifcopenshell_ifcgeom_transformation_t
    destructor: delete

  # === Element Types ===
  # Elements from the Iterator are borrowed; from create_shape they are owned.
  # Callers must only destroy elements they own.
  - name: element
    cpp_type: IfcGeom::Element
    c_type: ifcopenshell_ifcgeom_element_t
    destructor: delete

  - name: brep_element
    cpp_type: IfcGeom::BRepElement
    c_type: ifcopenshell_ifcgeom_brep_element_t
    destructor: delete

  - name: triangulation_element
    cpp_type: IfcGeom::TriangulationElement
    c_type: ifcopenshell_ifcgeom_triangulation_element_t
    destructor: delete

  - name: serialized_element
    cpp_type: IfcGeom::SerializedElement
    c_type: ifcopenshell_ifcgeom_serialized_element_t
    destructor: delete

  # === Representations ===
  - name: triangulation
    cpp_type: IfcGeom::Representation::Triangulation
    c_type: ifcopenshell_ifcgeom_triangulation_t
    destructor: none

  - name: brep_representation
    cpp_type: IfcGeom::Representation::BRep
    c_type: ifcopenshell_ifcgeom_brep_representation_t
    destructor: none

  - name: serialization
    cpp_type: IfcGeom::Representation::Serialization
    c_type: ifcopenshell_ifcgeom_serialization_t
    destructor: none

  - name: conversion_result_shape
    cpp_type: IfcGeom::ConversionResultShape
    c_type: ifcopenshell_ifcgeom_conversion_result_shape_t
    destructor: delete

  # === Taxonomy Types (shared_ptr-based) ===
  - name: taxonomy_item
    cpp_type: ifcopenshell::geometry::taxonomy::item
    c_type: ifcopenshell_ifcgeom_taxonomy_item_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_matrix4
    cpp_type: ifcopenshell::geometry::taxonomy::matrix4
    c_type: ifcopenshell_ifcgeom_taxonomy_matrix4_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_point3
    cpp_type: ifcopenshell::geometry::taxonomy::point3
    c_type: ifcopenshell_ifcgeom_taxonomy_point3_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_direction3
    cpp_type: ifcopenshell::geometry::taxonomy::direction3
    c_type: ifcopenshell_ifcgeom_taxonomy_direction3_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_style
    cpp_type: ifcopenshell::geometry::taxonomy::style
    c_type: ifcopenshell_ifcgeom_taxonomy_style_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_colour
    cpp_type: ifcopenshell::geometry::taxonomy::colour
    c_type: ifcopenshell_ifcgeom_taxonomy_colour_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_line
    cpp_type: ifcopenshell::geometry::taxonomy::line
    c_type: ifcopenshell_ifcgeom_taxonomy_line_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_circle
    cpp_type: ifcopenshell::geometry::taxonomy::circle
    c_type: ifcopenshell_ifcgeom_taxonomy_circle_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_ellipse
    cpp_type: ifcopenshell::geometry::taxonomy::ellipse
    c_type: ifcopenshell_ifcgeom_taxonomy_ellipse_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_bspline_curve
    cpp_type: ifcopenshell::geometry::taxonomy::bspline_curve
    c_type: ifcopenshell_ifcgeom_taxonomy_bspline_curve_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_offset_curve
    cpp_type: ifcopenshell::geometry::taxonomy::offset_curve
    c_type: ifcopenshell_ifcgeom_taxonomy_offset_curve_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_edge
    cpp_type: ifcopenshell::geometry::taxonomy::edge
    c_type: ifcopenshell_ifcgeom_taxonomy_edge_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_loop
    cpp_type: ifcopenshell::geometry::taxonomy::loop
    c_type: ifcopenshell_ifcgeom_taxonomy_loop_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_face
    cpp_type: ifcopenshell::geometry::taxonomy::face
    c_type: ifcopenshell_ifcgeom_taxonomy_face_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_shell
    cpp_type: ifcopenshell::geometry::taxonomy::shell
    c_type: ifcopenshell_ifcgeom_taxonomy_shell_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_solid
    cpp_type: ifcopenshell::geometry::taxonomy::solid
    c_type: ifcopenshell_ifcgeom_taxonomy_solid_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_plane
    cpp_type: ifcopenshell::geometry::taxonomy::plane
    c_type: ifcopenshell_ifcgeom_taxonomy_plane_t
    destructor: shared_ptr
    ptr_type: shared_ptr

  - name: taxonomy_cylinder
    cpp_type: ifcopenshell::geometry::taxonomy::cylinder
    c_type: ifcopenshell_ifcgeom_taxonomy_cylinder_t
    destructor: shared_ptr
