  # === Function Item Evaluator Methods ===

  - kind: adapter_method
    receiver: function_item_evaluator
    expose_as: evaluate_at
    returns:
      kind: double_list
      ownership: copy
    params:
      - name: u
        type:
          kind: double
    implementation:
      kind: inline_cpp
      body: |
        Eigen::Matrix4d mat = self_cpp->evaluate(u);
        std::vector<double> result(16);
        for (int i = 0; i < 4; ++i)
            for (int j = 0; j < 4; ++j)
                result[i * 4 + j] = mat(i, j);
        return result;
