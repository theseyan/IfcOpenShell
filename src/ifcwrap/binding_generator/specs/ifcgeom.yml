    c_type: ifcopenshell_ifcgeom_function_item_evaluator_t
    destructor: delete

# No discovery for now - we'll add adapter functions manually
# discover: null

functions:
  - kind: adapter_function
    expose_as: create_settings
    c_name: ifcopenshell_ifcgeom_create_settings
    returns:
      kind: handle
      handle: settings
      ownership: owned
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return new ifcopenshell::geometry::Settings();

  - kind: adapter_function
    expose_as: create_serializer_settings
    c_name: ifcopenshell_ifcgeom_create_serializer_settings
    returns:
      kind: handle
      handle: serializer_settings
      ownership: owned
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return new ifcopenshell::geometry::SerializerSettings();

  - kind: adapter_function
    expose_as: create_buffer
    c_name: ifcopenshell_ifcgeom_create_buffer
    returns:
      kind: handle
      handle: buffer
      ownership: owned
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return new stream_or_filename();

  - kind: adapter_function
    expose_as: create_buffer_from_filename
    c_name: ifcopenshell_ifcgeom_create_buffer_from_filename
    returns:
      kind: handle
      handle: buffer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
    implementation:
      kind: inline_cpp
      body: |
        return new stream_or_filename(filename_cpp);

  - kind: adapter_function
    expose_as: create_obj_serializer
    c_name: ifcopenshell_ifcgeom_create_obj_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: obj_output
        type:
          kind: handle
          handle: buffer
          ownership: borrowed
      - name: mtl_output
        type:
          kind: handle
          handle: buffer
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<GeometrySerializer*>(
            new WaveFrontOBJSerializer(*obj_output_cpp, *mtl_output_cpp, *geometry_settings_cpp, *serializer_settings_cpp));

  - kind: adapter_function
    expose_as: create_ttl_serializer
    c_name: ifcopenshell_ifcgeom_create_ttl_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: output
        type:
          kind: handle
          handle: buffer
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<GeometrySerializer*>(
            new TtlWktSerializer(*output_cpp, *geometry_settings_cpp, *serializer_settings_cpp));

  - kind: adapter_function
    expose_as: create_svg_serializer
    c_name: ifcopenshell_ifcgeom_create_svg_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: output
        type:
          kind: handle
          handle: buffer
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return static_cast<GeometrySerializer*>(
            new SvgSerializer(*output_cpp, *geometry_settings_cpp, *serializer_settings_cpp));

  - kind: adapter_function
    expose_as: create_gltf_serializer
    c_name: ifcopenshell_ifcgeom_create_gltf_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef WITH_GLTF
        return static_cast<GeometrySerializer*>(
            new GltfSerializer(std::string(filename), *geometry_settings_cpp, *serializer_settings_cpp));
        #else
        throw std::runtime_error("GLTF support not enabled in this build");
        #endif

  - kind: adapter_function
    expose_as: create_iges_serializer
    c_name: ifcopenshell_ifcgeom_create_iges_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef IFOPSH_WITH_OPENCASCADE
        return static_cast<GeometrySerializer*>(
            new IgesSerializer(std::string(filename), *geometry_settings_cpp, *serializer_settings_cpp));
        #else
        throw std::runtime_error("IGES serializer requires OpenCascade");
        #endif

  - kind: adapter_function
    expose_as: create_step_serializer
    c_name: ifcopenshell_ifcgeom_create_step_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef IFOPSH_WITH_OPENCASCADE
        return static_cast<GeometrySerializer*>(
            new StepSerializer(std::string(filename), *geometry_settings_cpp, *serializer_settings_cpp));
        #else
        throw std::runtime_error("STEP serializer requires OpenCascade");
        #endif

  - kind: adapter_function
    expose_as: create_collada_serializer
    c_name: ifcopenshell_ifcgeom_create_collada_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef WITH_OPENCOLLADA
        return static_cast<GeometrySerializer*>(
            new ColladaSerializer(std::string(filename), *geometry_settings_cpp, *serializer_settings_cpp));
        #else
        throw std::runtime_error("COLLADA serializer not available in this build");
        return static_cast<GeometrySerializer*>(nullptr); // unreachable; establishes return type
        #endif

  - kind: adapter_function
    expose_as: create_hdf_serializer
    c_name: ifcopenshell_ifcgeom_create_hdf_serializer
    returns:
      kind: handle
      handle: geometry_serializer
      ownership: owned
    params:
      - name: filename
        type:
          kind: string
          ownership: borrowed
      - name: geometry_settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: serializer_settings
        type:
          kind: handle
          handle: serializer_settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #if defined(WITH_HDF5) && defined(IFOPSH_WITH_OPENCASCADE)
        return static_cast<GeometrySerializer*>(
            new HdfSerializer(std::string(filename), *geometry_settings_cpp, *serializer_settings_cpp));
        #else
        throw std::runtime_error("HDF serializer not available in this build");
        return static_cast<GeometrySerializer*>(nullptr); // unreachable; establishes return type
        #endif

  - kind: adapter_function
    expose_as: create_json_serializer
    c_name: ifcopenshell_ifcgeom_create_json_serializer
    returns:
      kind: handle
      handle: serializer
      ownership: owned
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: filename
        type:
          kind: string
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef WITH_GLTF
        return new JsonSerializer(file_cpp, std::string(filename));
        #else
        throw std::runtime_error("JSON serializer requires GLTF support (nlohmann_json)");
        #endif

  - kind: adapter_function
    expose_as: create_xml_serializer
    c_name: ifcopenshell_ifcgeom_create_xml_serializer
    returns:
      kind: handle
      handle: serializer
      ownership: owned
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: filename
        type:
          kind: string
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return new XmlSerializer(file_cpp, std::string(filename));

  - kind: adapter_function
    expose_as: create_rocksdb_serializer
    c_name: ifcopenshell_ifcgeom_create_rocksdb_serializer
    returns:
      kind: handle
      handle: serializer
      ownership: owned
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: rocksdb_filename
        type:
          kind: string
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        #ifdef IFOPSH_WITH_ROCKSDB
        return new RocksDbSerializer(file_cpp, std::string(rocksdb_filename));
        #else
        throw std::runtime_error("RocksDB serializer requires WITH_ROCKSDB support");
        #endif

  - kind: adapter_function
    expose_as: create_rocksdb_serializer_streaming
    c_name: ifcopenshell_ifcgeom_create_rocksdb_serializer_streaming
    returns:
      kind: handle
      handle: serializer
      ownership: owned
    params:
      - name: input_filename
        type:
          kind: string
          ownership: borrowed
      - name: rocksdb_filename
        type:
          kind: string
          ownership: borrowed
      - name: stream
        type:
          kind: bool
    implementation:
      kind: inline_cpp
      body: |
        #ifdef IFOPSH_WITH_ROCKSDB
        return new RocksDbSerializer(std::string(input_filename), std::string(rocksdb_filename), stream);
        #else
        throw std::runtime_error("RocksDB serializer requires WITH_ROCKSDB support");
        #endif

  - kind: adapter_function
    expose_as: create_tree
    c_name: ifcopenshell_ifcgeom_create_tree
    returns:
      kind: handle
      handle: tree
      ownership: owned
    params: []
    implementation:
      kind: inline_cpp
      body: |
        return new IfcGeom::tree();

  - kind: adapter_function
    expose_as: create_tree_from_file
    c_name: ifcopenshell_ifcgeom_create_tree_from_file
    returns:
      kind: handle
      handle: tree
      ownership: owned
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return new IfcGeom::tree(*file_cpp);

  - kind: adapter_function
    expose_as: create_tree_from_file_with_settings
    c_name: ifcopenshell_ifcgeom_create_tree_from_file_with_settings
    returns:
      kind: handle
      handle: tree
      ownership: owned
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return new IfcGeom::tree(*file_cpp, *settings_cpp);

  - kind: adapter_function
    expose_as: create_tree_from_iterator
    c_name: ifcopenshell_ifcgeom_create_tree_from_iterator
    returns:
      kind: handle
      handle: tree
      ownership: owned
    params:
      - name: iterator
        type:
          kind: handle
          handle: iterator
          ownership: borrowed
    implementation:
      kind: inline_cpp
      body: |
        return new IfcGeom::tree(*iterator_cpp);

  # Iterator constructor - takes file handle from ifcparse
  - kind: adapter_function
    expose_as: create_iterator
    c_name: ifcopenshell_ifcgeom_create_iterator
    returns:
      kind: handle
      handle: iterator
      ownership: owned
    params:
      - name: geometry_library
        type:
          kind: string
      - name: settings
        type:
          kind: handle
          handle: settings
          ownership: borrowed
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: num_threads
        type:
          kind: int32
    implementation:
      kind: inline_cpp
      body: |
        auto* settings_ptr = settings_cpp;
        auto kernel = ifcopenshell::geometry::kernels::construct(file_cpp, geometry_library_cpp, *settings_ptr);
        return new IfcGeom::Iterator(std::move(kernel), *settings_ptr, file_cpp, num_threads);

  - kind: adapter_function
    expose_as: create_iterator_with_include_exclude
