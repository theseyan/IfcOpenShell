          kind: string

  - expose_as: value_as_bool
    cpp_name: ifcapi::bindings::value_as_bool
    returns:
      kind: bool
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_new_none
    cpp_name: ifcapi::bindings::value_new_none
    returns:
      kind: handle
      handle: value
      ownership: owned
    params: []

  - expose_as: value_new_bool
    cpp_name: ifcapi::bindings::value_new_bool
