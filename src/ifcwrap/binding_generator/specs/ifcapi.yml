    fields:
      - name: representation
        type: {kind: handle, handle: instance, ownership: borrowed, nullable: true}
      - name: has_result
        type: {kind: bool}
      - name: start_length
        type: {kind: double}
      - name: end_length
        type: {kind: double}
      - name: angle
        type: {kind: double}
      - name: profile_offset
        type: {kind: double_list}
