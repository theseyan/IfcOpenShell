        type: {kind: string, ownership: owned}
      - name: is_entity
        type: {kind: bool}
  - name: sequence_duplicate_task_result
    cpp_type: ifcapi::bindings::SequenceDuplicateTaskResult
    c_type: ifcopenshell_sequence_duplicate_task_result_t
    fields:
      - name: current
        type: {kind: instance_list}
      - name: duplicate
        type: {kind: instance_list}

