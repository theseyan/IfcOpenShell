  - expose_as: compute_derived
    cpp_name: ifcapi::bindings::compute_derived
    returns:
      kind: handle
      handle: value
      ownership: owned
      nullable: true
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attribute_name
