# High-level IfcOpenShell API binding specification.
#
# This spec intentionally imports core handles from ifcparse rather than
# redefining file/entity ownership. YAML remains policy and facade selection;
# the stable callable surface lives in src/ifcapi/include/ifcapi/bindings/.
schema_version: 1
module: ifcopenshell
slice: ifcapi
c_prefix: ifcopenshell_ifcapi

public_headers:
  - guid.h
  - ifcapi/bindings/element.h
  - ifcapi/bindings/entity.h
  - ifcapi/bindings/value.h

imports:
  - slice: ifcparse
    handles:
      - file
      - instance

handles:
  - name: value
    cpp_type: ifcopenshell_value_t
    c_type: ifcopenshell_ifcapi_value_t
    destructor: function:ifcapi::bindings::value_free

functions:
  - expose_as: guid_new
    cpp_name: ifcapi::guid_new
    returns:
      kind: string
      ownership: owned
    params: []

  - expose_as: guid_compress
    cpp_name: ifcapi::guid_compress
    returns:
      kind: string
      ownership: owned
    params:
      - name: uuid_hex
        type:
          kind: string

  - expose_as: guid_expand
    cpp_name: ifcapi::guid_expand
    returns:
      kind: string
      ownership: owned
    params:
      - name: guid
        type:
          kind: string

  - expose_as: element_get_type
    cpp_name: ifcapi::bindings::element_get_type
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed

  - expose_as: element_get_aggregate
    cpp_name: ifcapi::bindings::element_get_aggregate
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed

  - expose_as: element_get_nest
    cpp_name: ifcapi::bindings::element_get_nest
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed

  - expose_as: element_get_container
    cpp_name: ifcapi::bindings::element_get_container
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: direct_only
        type:
          kind: bool
      - name: ifc_class
        type:
          kind: string
          nullable: true

  - expose_as: element_get_parent
    cpp_name: ifcapi::bindings::element_get_parent
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed

  - expose_as: element_get_material
    cpp_name: ifcapi::bindings::element_get_material
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: should_skip_usage
        type:
          kind: bool
      - name: should_inherit
        type:
          kind: bool

  - expose_as: entity_set_typed_value
    cpp_name: ifcapi::bindings::entity_set_typed_value
    returns:
      kind: bool
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attr
        type:
          kind: string
      - name: type_name
        type:
          kind: string
      - name: str_value
        type:
          kind: string
          nullable: true

  - expose_as: entity_get_typed_value
    cpp_name: ifcapi::bindings::entity_get_typed_value
    returns:
      kind: string_list
      ownership: copy
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attr
        type:
          kind: string

  - expose_as: entity_set_aggregate_typed_value
    cpp_name: ifcapi::bindings::entity_set_aggregate_typed_value
    returns:
      kind: bool
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attr
        type:
          kind: string
      - name: type_names
        type:
          kind: string_list
          ownership: copy
      - name: str_values
        type:
          kind: string_list
          ownership: copy

  - expose_as: entity_get_aggregate_typed_value
    cpp_name: ifcapi::bindings::entity_get_aggregate_typed_value
    returns:
      kind: string_list
      ownership: copy
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attr
        type:
          kind: string

  - expose_as: value_kind
    cpp_name: ifcapi::bindings::value_kind
    returns:
      kind: int32
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: selector_get_element_value
    cpp_name: ifcapi::bindings::selector_get_element_value
    returns:
      kind: handle
      handle: value
      ownership: owned
      nullable: true
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
          nullable: true
      - name: element
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: query
        type:
          kind: string

  - expose_as: compute_derived
    cpp_name: ifcapi::bindings::compute_derived
    returns:
      kind: handle
      handle: value
      ownership: owned
      nullable: true
    params:
      - name: instance
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: attribute_name
        type:
          kind: string

  - expose_as: value_as_bool
    cpp_name: ifcapi::bindings::value_as_bool
    returns:
      kind: bool
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_as_int64
    cpp_name: ifcapi::bindings::value_as_int64
    returns:
      kind: int64
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_as_double
    cpp_name: ifcapi::bindings::value_as_double
    returns:
      kind: double
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_as_string
    cpp_name: ifcapi::bindings::value_as_string
    returns:
      kind: string
      ownership: copy
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_as_instance
    cpp_name: ifcapi::bindings::value_as_instance
    returns:
      kind: handle
      handle: instance
      ownership: borrowed
      nullable: true
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_list_size
    cpp_name: ifcapi::bindings::value_list_size
    returns:
      kind: size
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_list_at
    cpp_name: ifcapi::bindings::value_list_at
    returns:
      kind: handle
      handle: value
      ownership: borrowed
      nullable: true
      cpp_type: const ifcopenshell_value_t*
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed
      - name: index
        type:
          kind: size

  - expose_as: value_dict_size
    cpp_name: ifcapi::bindings::value_dict_size
    returns:
      kind: size
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: value_dict_key_at
    cpp_name: ifcapi::bindings::value_dict_key_at
    returns:
      kind: string
      ownership: copy
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed
      - name: index
        type:
          kind: size

  - expose_as: value_dict_value_at
    cpp_name: ifcapi::bindings::value_dict_value_at
    returns:
      kind: handle
      handle: value
      ownership: borrowed
      nullable: true
      cpp_type: const ifcopenshell_value_t*
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed
      - name: index
        type:
          kind: size
