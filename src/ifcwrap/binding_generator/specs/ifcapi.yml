      kind: string
      ownership: copy
    params:
      - name: symbol
        type:
          kind: string

  - expose_as: value_kind
    cpp_name: ifcapi::bindings::value_kind
    returns:
      kind: int32
    params:
      - name: value
        type:
          kind: handle
          handle: value
          ownership: borrowed

  - expose_as: selector_get_element_value
    cpp_name: ifcapi::bindings::selector_get_element_value
    returns:
      kind: handle
      handle: value
      ownership: owned
      nullable: true
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
          nullable: true
      - name: element
        type:
          kind: handle
          handle: instance
          ownership: borrowed
      - name: query
        type:
          kind: string

  - expose_as: selector_set_element_value
    cpp_name: ifcapi::bindings::selector_set_element_value
    returns:
      kind: bool
    params:
      - name: file
        type:
          kind: handle
          handle: file
          ownership: borrowed
      - name: element
        type:
