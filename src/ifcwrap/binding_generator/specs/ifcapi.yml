# High-level IfcOpenShell API binding specification.
#
# This spec intentionally imports core handles from ifcparse rather than
# redefining file/entity ownership. YAML remains policy and facade selection;
# the stable callable surface lives in src/ifcapi/include/ifcapi/bindings/.
schema_version: 1
module: ifcopenshell
slice: ifcapi
c_prefix: ifcopenshell_ifcapi

public_headers:
  - ifcapi/bindings/aggregate.h
  - ifcapi/bindings/attribute.h
  - ifcapi/bindings/boundary.h
  - guid.h
  - ifcapi/bindings/classification.h
  - ifcapi/bindings/cogo.h
  - ifcapi/bindings/constraint.h
  - ifcapi/bindings/control.h
  - ifcapi/bindings/context.h
  - ifcapi/bindings/cost.h
  - ifcapi/bindings/document.h
  - ifcapi/bindings/drawing.h
  - ifcapi/bindings/element.h
  - ifcapi/bindings/entity.h
  - ifcapi/bindings/feature.h
  - ifcapi/bindings/georeference.h
  - ifcapi/bindings/geometry.h
  - ifcapi/bindings/group.h
  - ifcapi/bindings/grid.h
  - ifcapi/bindings/layer.h
  - ifcapi/bindings/library.h
  - ifcapi/bindings/material.h
  - ifcapi/bindings/nest.h
  - ifcapi/bindings/owner.h
  - ifcapi/bindings/placement.h
  - ifcapi/bindings/profile.h
  - ifcapi/bindings/project.h
  - ifcapi/bindings/pset.h
  - ifcapi/bindings/pset_template.h
  - ifcapi/bindings/representation.h
  - ifcapi/bindings/resource.h
  - ifcapi/bindings/root.h
  - ifcapi/bindings/schema.h
  - ifcapi/bindings/sequence.h
  - ifcapi/bindings/selector.h
  - ifcapi/bindings/shape.h
  - ifcapi/bindings/shape_builder.h
  - ifcapi/bindings/spatial.h
  - ifcapi/bindings/style.h
  - ifcapi/bindings/structural.h
  - ifcapi/bindings/system.h
  - ifcapi/bindings/type.h
  - ifcapi/bindings/unit.h
  - ifcapi/bindings/value.h

result_structs:
  - name: shape_builder_mep_transition_shape_result
    cpp_type: ifcapi::bindings::ShapeBuilderMepTransitionShapeResult
    c_type: ifcopenshell_shape_builder_mep_transition_shape_result_t
    fields:
      - name: representation
        type: {kind: handle, handle: instance, ownership: borrowed, nullable: true}
      - name: has_result
        type: {kind: bool}
      - name: start_length
        type: {kind: double}
      - name: end_length
        type: {kind: double}
      - name: angle
        type: {kind: double}
      - name: profile_offset
        type: {kind: double_list}
      - name: transition_length
        type: {kind: double}
      - name: full_transition_length
        type: {kind: double}
  - name: shape_builder_mep_bend_shape_result
    cpp_type: ifcapi::bindings::ShapeBuilderMepBendShapeResult
    c_type: ifcopenshell_shape_builder_mep_bend_shape_result_t
    fields:
      - name: representation
        type: {kind: handle, handle: instance, ownership: borrowed}
      - name: start_length
        type: {kind: double}
      - name: end_length
        type: {kind: double}
      - name: radius
        type: {kind: double}
      - name: angle
        type: {kind: double}
      - name: lateral_axis
        type: {kind: int32}
      - name: lateral_sign
        type: {kind: double}
      - name: z_axis_sign
        type: {kind: int32}
      - name: main_profile_dimension
        type: {kind: double}
  - name: sequence_date_time_result
    cpp_type: ifcapi::bindings::SequenceDateTimeResult
    c_type: ifcopenshell_sequence_date_time_result_t
    fields:
      - name: date_time
        type: {kind: handle, handle: instance, ownership: borrowed, nullable: true}
      - name: date_time_string
        type: {kind: string, ownership: owned}
      - name: is_entity
        type: {kind: bool}
  - name: sequence_duplicate_task_result
    cpp_type: ifcapi::bindings::SequenceDuplicateTaskResult
    c_type: ifcopenshell_sequence_duplicate_task_result_t
    fields:
      - name: current
        type: {kind: instance_list}
      - name: duplicate
        type: {kind: instance_list}

imports:
  - slice: ifcparse
    handles:
      - file
      - instance
      - instance_list

discover:
  include_dir: ../../../ifcapi/src
  functions:
    - namespace: ifcapi::bindings
handles:
  - name: value
    cpp_type: ifcopenshell_value_t
    c_type: ifcopenshell_ifcapi_value_t
    destructor: function:ifcapi::bindings::value_free

functions:
  - expose_as: guid_new
    cpp_name: ifcapi::guid_new
    returns:
      kind: string
      ownership: owned
    params: []

  - expose_as: guid_compress
    cpp_name: ifcapi::guid_compress
    returns:
      kind: string
      ownership: owned
    params:
      - name: uuid_hex
        type:
          kind: string

  - expose_as: guid_expand
    cpp_name: ifcapi::guid_expand
    returns:
      kind: string
      ownership: owned
    params:
      - name: guid
        type:
          kind: string
