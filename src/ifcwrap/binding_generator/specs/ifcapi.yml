  - ifcapi/bindings/pset_template.h
  - ifcapi/bindings/representation.h
  - ifcapi/bindings/root.h
  - ifcapi/bindings/schema.h
  - ifcapi/bindings/selector.h
  - ifcapi/bindings/shape.h
  - ifcapi/bindings/shape_builder.h
  - ifcapi/bindings/spatial.h
  - ifcapi/bindings/type.h
  - ifcapi/bindings/unit.h
  - ifcapi/bindings/value.h

