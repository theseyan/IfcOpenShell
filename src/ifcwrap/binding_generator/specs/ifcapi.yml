# High-level IfcOpenShell API binding specification.
#
# This spec intentionally imports core handles from ifcparse rather than
# redefining file/entity ownership. YAML remains policy and facade selection;
# the stable callable surface lives in src/ifcapi/include/ifcapi/bindings/.
schema_version: 1
module: ifcopenshell
slice: ifcapi
c_prefix: ifcopenshell_ifcapi

public_headers:
  - guid.h
  - ifcapi/bindings/element.h
  - ifcapi/bindings/entity.h
  - ifcapi/bindings/shape.h
  - ifcapi/bindings/unit.h
  - ifcapi/bindings/value.h

imports:
  - slice: ifcparse
    handles:
      - file
      - instance

discover:
  include_dir: ../../../ifcapi/src
  functions:
    - namespace: ifcapi::bindings
      translation_unit: element.cpp
      include:
        - compute_derived
        - element_get_aggregate
        - element_get_container
        - element_get_material
        - element_get_nest
        - element_get_parent
        - element_get_type
        - entity_get_aggregate_typed_value
        - entity_get_typed_value
        - entity_set_aggregate_typed_value
        - entity_set_typed_value
        - selector_filter_all
        - selector_filter_elements
        - selector_get_element_value
        - selector_set_element_value
        - shape_is_x
        - unit_calculate_unit_scale
        - unit_convert
        - unit_convert_unit
        - unit_format_length
        - unit_get_full_unit_name
        - unit_get_measure_class
        - unit_get_measure_unit_type
        - unit_get_named_dimensions
        - unit_get_prefix
        - unit_get_prefix_multiplier
        - unit_get_project_unit
        - unit_get_si_dimensions
        - unit_get_symbol_measure_class
        - unit_get_symbol_quantity_class
        - unit_get_unit_assignment
        - unit_get_unit_name
        - unit_get_unit_name_universal
        - unit_get_unit_symbol
        - unit_resolve_property_measure_class
        - unit_resolve_property_table_defined_measure_class
        - unit_resolve_property_table_defined_unit
        - unit_resolve_property_table_defining_measure_class
        - unit_resolve_property_table_defining_unit
        - unit_resolve_property_unit
        - value_as_bool
        - value_as_double
        - value_as_instance
        - value_as_int64
        - value_as_string
        - value_dict_key_at
        - value_dict_size
        - value_dict_value_at
        - value_kind
        - value_list_append
        - value_list_at
        - value_list_size
        - value_new_bool
        - value_new_double
        - value_new_instance
        - value_new_int
        - value_new_list
        - value_new_none
        - value_new_string
      type_overrides:
        compute_derived:
          returns:
            ownership: owned
            nullable: true
        element_get_container:
          params:
            ifc_class:
              nullable: true
        entity_set_typed_value:
          params:
            str_value:
              nullable: true
        selector_filter_all:
          returns:
            ownership: owned
            nullable: true
        selector_filter_elements:
          returns:
            ownership: owned
            nullable: true
        selector_get_element_value:
          returns:
            ownership: owned
            nullable: true
          params:
            file:
              nullable: true
        selector_set_element_value:
          params:
            element:
              nullable: true
            value:
              nullable: true
            concat:
              nullable: true
        value_list_append:
          params:
            item:
              nullable: true
        value_new_bool:
          returns:
            ownership: owned
        value_new_double:
          returns:
            ownership: owned
        value_new_instance:
          returns:
            ownership: owned
          params:
            value:
              nullable: true
        value_new_int:
          returns:
            ownership: owned
        value_new_list:
          returns:
            ownership: owned
        value_new_none:
          returns:
            ownership: owned
        value_new_string:
          returns:
            ownership: owned

handles:
  - name: value
    cpp_type: ifcopenshell_value_t
    c_type: ifcopenshell_ifcapi_value_t
    destructor: function:ifcapi::bindings::value_free

functions:
  - expose_as: guid_new
    cpp_name: ifcapi::guid_new
    returns:
      kind: string
      ownership: owned
    params: []

  - expose_as: guid_compress
    cpp_name: ifcapi::guid_compress
    returns:
      kind: string
      ownership: owned
    params:
      - name: uuid_hex
        type:
          kind: string

  - expose_as: guid_expand
    cpp_name: ifcapi::guid_expand
    returns:
      kind: string
      ownership: owned
    params:
      - name: guid
        type:
          kind: string
